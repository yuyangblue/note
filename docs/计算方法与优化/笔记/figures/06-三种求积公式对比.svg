<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="570" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">梯形/辛普森/柯特斯公式对比</text>
<text x="48" y="72" font-size="15" fill="#6B7280">三个最常用的牛顿-柯特斯公式，节点数和代数精度递增</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="60" y="100" width="260" height="380" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="190" y="135" font-size="18" fill="#4A6FB5" font-weight="700" text-anchor="middle">梯形公式</text>
<rect x="130" y="155" width="120" height="28" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1"/>
<text x="190" y="174" font-size="11" fill="#4A6FB5" font-weight="600" text-anchor="middle">n=1 (2点)</text>
<text x="190" y="200" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">代数精度</text>
<text x="190" y="220" font-size="14" fill="#1A1B1C" font-weight="700" text-anchor="middle">1次代数精度</text>
<text x="190" y="250" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">柯特斯系数</text>
<text x="190" y="270" font-size="12" fill="#4A6FB5" font-weight="600" text-anchor="middle">1/2, 1/2</text>
<text x="190" y="305" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">公式</text>
<text x="190" y="325" font-size="10" fill="#1A1B1C" font-weight="400" text-anchor="middle">(b-a)/2[f(a)+f(b)]</text>
<text x="190" y="365" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">余项</text>
<text x="190" y="385" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">O((b-a)^3 f'')</text>
<rect x="360" y="100" width="260" height="380" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="490" y="135" font-size="18" fill="#70AD47" font-weight="700" text-anchor="middle">辛普森公式</text>
<rect x="430" y="155" width="120" height="28" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="1"/>
<text x="490" y="174" font-size="11" fill="#70AD47" font-weight="600" text-anchor="middle">n=2 (3点)</text>
<text x="490" y="200" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">代数精度</text>
<text x="490" y="220" font-size="14" fill="#1A1B1C" font-weight="700" text-anchor="middle">3次代数精度</text>
<text x="490" y="250" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">柯特斯系数</text>
<text x="490" y="270" font-size="12" fill="#70AD47" font-weight="600" text-anchor="middle">1/6, 4/6, 1/6</text>
<text x="490" y="305" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">公式</text>
<text x="490" y="325" font-size="10" fill="#1A1B1C" font-weight="400" text-anchor="middle">(b-a)/6[f(a)+4f(mid)+f(b)]</text>
<text x="490" y="365" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">余项</text>
<text x="490" y="385" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">O((b-a)^5 f^(4))</text>
<rect x="660" y="100" width="260" height="380" rx="14" fill="#EDE7F6" stroke="#8E7CC3" stroke-width="2"/>
<text x="790" y="135" font-size="18" fill="#8E7CC3" font-weight="700" text-anchor="middle">柯特斯公式</text>
<rect x="730" y="155" width="120" height="28" rx="14" fill="#EDE7F6" stroke="#8E7CC3" stroke-width="1"/>
<text x="790" y="174" font-size="11" fill="#8E7CC3" font-weight="600" text-anchor="middle">n=4 (5点)</text>
<text x="790" y="200" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">代数精度</text>
<text x="790" y="220" font-size="14" fill="#1A1B1C" font-weight="700" text-anchor="middle">5次代数精度</text>
<text x="790" y="250" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">柯特斯系数</text>
<text x="790" y="270" font-size="12" fill="#8E7CC3" font-weight="600" text-anchor="middle">7,32,12,32,7 /90</text>
<text x="790" y="305" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">公式</text>
<text x="790" y="325" font-size="10" fill="#1A1B1C" font-weight="400" text-anchor="middle">(b-a)/90[7f0+32f1+12f2+32f3+7f4]</text>
<text x="790" y="365" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">余项</text>
<text x="790" y="385" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">O((b-a)^7 f^(6))</text>
<line x1="320" y1="290" x2="350" y2="290" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
<line x1="620" y1="290" x2="650" y2="290" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="275" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">节点越多，精度越高</text>
<rect x="60" y="500" width="840" height="40" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="525" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">n为偶数时代数精度提高一阶（辛普森n=2却有3次精度）；n&lt;=7系数全正稳定</text>
<rect x="36" y="508" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="531" font-size="15" fill="#2F5597" font-weight="600">n为偶数时代数精度提高一阶；n≤7系数全正稳定</text>
</svg>