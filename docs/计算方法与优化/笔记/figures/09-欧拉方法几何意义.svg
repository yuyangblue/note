<line x1="630" y1="28" x2="750" y2="-79" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="630" cy="28" r="5" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/><text x="630" y="33" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="750" cy="-79" r="5" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/><text x="750" y="-74" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="160" y="250" font-size="12" fill="#2F5597" font-weight="600" text-anchor="start">y0</text>
