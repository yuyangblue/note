<line x1="390" y1="190" x2="510" y2="118" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="390" cy="190" r="5" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/><text x="390" y="195" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
