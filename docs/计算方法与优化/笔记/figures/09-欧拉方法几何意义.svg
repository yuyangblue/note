<text x="500" y="200" font-size="13" fill="#2F5597" font-weight="600" text-anchor="start">欧拉折线（每段用当前点切线近似）</text>
<rect x="60" y="420" width="840" height="50" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="442" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">向前欧拉：y_{n+1} = y_n + h·f(x_n, y_n)，用(x_n,y_n)处的切线近似积分曲线</text>
<text x="480" y="462" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">一阶精度，局部误差O(h²)，整体误差O(h)；显式，计算简单但条件稳定</text>
<rect x="36" y="438" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="461" font-size="15" fill="#2F5597" font-weight="600">一阶精度，显式，条件稳定</text>
</svg>