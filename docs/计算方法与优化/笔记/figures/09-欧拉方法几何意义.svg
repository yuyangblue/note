<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="500" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">欧拉方法几何意义</text>
<text x="48" y="72" font-size="15" fill="#6B7280">用当前点处的切线近似积分曲线，逐步推进得到离散近似解</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
