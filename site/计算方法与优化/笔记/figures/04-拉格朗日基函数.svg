<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">拉格朗日插值基函数</text>
<text x="48" y="72" font-size="15" fill="#6B7280">每个基函数在对应节点为1，其他节点为0，插值多项式是基函数的线性组合</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="320" x2="880" y2="320" stroke="#6B7280" stroke-width="1.5"/>
<line x1="180" y1="80" x2="180" y2="420" stroke="#6B7280" stroke-width="1"/>
<text x="175" y="435" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">x0</text>
<line x1="480" y1="80" x2="480" y2="420" stroke="#6B7280" stroke-width="1"/>
<text x="475" y="435" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">x1</text>
<line x1="780" y1="80" x2="780" y2="420" stroke="#6B7280" stroke-width="1"/>
<text x="775" y="435" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">x2</text>
<line x1="80" y1="180" x2="880" y2="180" stroke="#C9CDD4" stroke-width="1" stroke-dasharray="4,3"/>
<text x="75" y="185" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">1</text>
<path d="M 100,400 Q 140,280 180,180 Q 280,300 380,360 Q 480,390 580,400 Q 680,405 780,408 Q 830,410 860,412" fill="none" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="200" y="160" font-size="13" fill="#2F5597" font-weight="700" text-anchor="start">l0(x)</text>
<path d="M 100,400 Q 200,390 300,350 Q 380,280 480,180 Q 580,280 660,350 Q 740,390 860,405" fill="none" stroke="#70AD47" stroke-width="2.5"/>
<text x="500" y="160" font-size="13" fill="#375623" font-weight="700" text-anchor="start">l1(x)</text>
<path d="M 100,412 Q 200,410 300,405 Q 400,395 500,370 Q 600,320 700,240 Q 750,190 780,180 Q 820,200 860,250" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<text x="720" y="160" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">l2(x)</text>
<circle cx="180" cy="180" r="6" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/><text x="180" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="480" cy="180" r="6" fill="#FFFFFF" stroke="#70AD47" stroke-width="2"/><text x="480" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="780" cy="180" r="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/><text x="780" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="480" y="480" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">基函数性质：l_i(x_j) = delta_ij（i=j时为1，否则为0）</text>
<text x="480" y="505" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">插值多项式 P_n(x) = sum y_i * l_i(x)，线性组合基函数</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">l_i(x) = prod_{j!=i} (x-x_j)/(x_i-x_j)</text>
</svg>