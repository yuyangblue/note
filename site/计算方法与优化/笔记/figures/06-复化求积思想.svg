<rect x="60" y="420" width="840" height="90" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="445" font-size="16" fill="#2F5597" font-weight="700" text-anchor="middle">复化求积 = 区间分割 + 每段低阶公式 + 累加</text>
<text x="480" y="472" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">避免高次插值的龙格现象；h-&gt;0时收敛；系数全正稳定</text>
<text x="480" y="495" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">复化梯形 O(h^2) | 复化辛普森 O(h^4) | 复化柯特斯 O(h^6)</text>
