<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">Householder变换：镜面反射</text>
<text x="48" y="72" font-size="15" fill="#6B7280">H=I-2vv^T是对称正交矩阵，将向量关于以v为法向量的平面做镜面反射</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="200" y1="150" x2="760" y2="410" stroke="#8A6D1A" stroke-width="3"/>
<text x="720" y="430" font-size="12" fill="#8A6D1A" font-weight="600" text-anchor="start">镜面（v为法向量）</text>
<line x1="480" y1="280" x2="560" y2="220" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<text x="570" y="215" font-size="16" fill="#8A6D1A" font-weight="700" text-anchor="start">v</text>
<line x1="480" y1="280" x2="350" y2="180" stroke="#4A6FB5" stroke-width="3" marker-end="url(#arr)"/>
<text x="330" y="170" font-size="18" fill="#2F5597" font-weight="700" text-anchor="start">x</text>
<line x1="480" y1="280" x2="620" y2="380" stroke="#70AD47" stroke-width="3" marker-end="url(#arr)"/>
<text x="630" y="395" font-size="18" fill="#375623" font-weight="700" text-anchor="start">Hx</text>
<line x1="480" y1="280" x2="430" y2="240" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<text x="410" y="225" font-size="14" fill="#6B7280" font-weight="600" text-anchor="start">u</text>
<line x1="430" y1="240" x2="350" y2="180" stroke="#C9CDD4" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="430" y1="240" x2="620" y2="380" stroke="#C9CDD4" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="60" y="450" width="840" height="60" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="475" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">H = I - 2vv^T (||v||=1)，对称正交；Hx是x关于以v为法向量平面的镜面反射</text>
<text x="480" y="498" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">关键性质：若||x||=||y||，取v=(x-y)/||x-y||，则Hx=y（可将向量化为||x||e1）</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">可将任意向量化为||x||e1（除首分量外全为零）</text>
</svg>