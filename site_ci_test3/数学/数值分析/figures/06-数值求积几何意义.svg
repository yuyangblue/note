<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">数值求积几何意义</text>
<text x="48" y="72" font-size="15" fill="#6B7280">用梯形面积近似曲边梯形面积，是数值积分的基本思想</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="320" x2="880" y2="320" stroke="#6B7280" stroke-width="1.5"/>
<line x1="100" y1="80" x2="100" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<text x="890" y="335" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">x</text>
<text x="105" y="75" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">y</text>
<path d="M 120,350 Q 200,200 350,180 Q 500,170 600,220 Q 700,280 820,300" fill="none" stroke="#4A6FB5" stroke-width="3"/>
<text x="750" y="195" font-size="15" fill="#2F5597" font-weight="700" text-anchor="start">f(x)</text>
<path d="M 150,320 L 150,290 Q 250,180 400,175 Q 550,180 650,230 L 650,320 Z" fill="#E7EDFB" stroke="none" opacity="0.6"/>
<polygon points="150,320 150,285 650,235 650,320" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="400" y="260" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">梯形面积</text>
<text x="150" y="338" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="middle">a</text>
<text x="650" y="338" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="middle">b</text>
<line x1="150" y1="325" x2="150" y2="290" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<line x1="650" y1="325" x2="650" y2="240" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="60" y="440" width="840" height="70" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="465" font-size="16" fill="#2F5597" font-weight="700" text-anchor="middle">数值求积：用简单图形面积近似曲边梯形面积</text>
<text x="480" y="492" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">梯形公式 = (b-a)/2 * [f(a)+f(b)]，用直线下的梯形面积近似</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">积分=面积，用简单多边形面积近似复杂曲线下面积</text>
</svg>