<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="530" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">函数逼近的几何意义：正交投影</text>
<text x="48" y="72" font-size="15" fill="#6B7280">把连续函数空间想象成高维空间，最佳平方逼近是f在子空间S上的垂直投影</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="60" y="100" width="840" height="380" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<polygon points="150,350 450,200 750,250 450,400" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2" opacity="0.7"/>
<text x="450" y="185" font-size="16" fill="#2F5597" font-weight="700" text-anchor="middle">子空间 S</text>
<line x1="450" y1="380" x2="350" y2="180" stroke="#C0392B" stroke-width="3"/>
<circle cx="350" cy="180" r="8" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="350" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="330" y="170" font-size="18" fill="#8B2222" font-weight="700" text-anchor="middle">f</text>
<line x1="450" y1="380" x2="380" y2="290" stroke="#70AD47" stroke-width="3"/>
<circle cx="380" cy="290" r="8" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="380" y="295" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="360" y="305" font-size="18" fill="#375623" font-weight="700" text-anchor="middle">phi</text>
<line x1="380" y1="290" x2="350" y2="180" stroke="#8A6D1A" stroke-width="2" stroke-dasharray="6,4"/>
<text x="320" y="235" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">f-phi</text>
<polyline points="370,285 375,275 385,280" fill="none" stroke="#8A6D1A" stroke-width="1.5"/>
<text x="480" y="440" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">最佳平方逼近 = f 在子空间 S 上的正交投影</text>
<text x="480" y="468" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">(f-phi) 与 S 中所有函数正交，即 (f-phi, psi)=0</text>
<text x="480" y="490" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">勾股定理：||f-phi||_2^2 = ||f||_2^2 - ||phi||_2^2</text>
<rect x="36" y="468" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="491" font-size="15" fill="#2F5597" font-weight="600">误差f-phi与S正交，垂足到f的距离最短</text>
</svg>