<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">幂法迭代过程</text>
<text x="48" y="72" font-size="15" fill="#6B7280">反复乘A，模最大特征值方向占主导，迭代向量逐渐转向主特征向量</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="100" y1="280" x2="860" y2="280" stroke="#6B7280" stroke-width="1"/>
<line x1="480" y1="100" x2="480" y2="420" stroke="#6B7280" stroke-width="1"/>
<line x1="480" y1="280" x2="700" y2="150" stroke="#70AD47" stroke-width="3" marker-end="url(#arr)"/>
<text x="710" y="145" font-size="13" fill="#375623" font-weight="700" text-anchor="start">x1 (λ1最大)</text>
<line x1="480" y1="280" x2="300" y2="380" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<text x="250" y="395" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">x2 (λ2较小)</text>
<line x1="480" y1="280" x2="550" y2="350" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<text x="560" y="360" font-size="13" fill="#6B7280" font-weight="600" text-anchor="start">u0</text>
<line x1="550" y1="350" x2="600" y2="300" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="535" y="340" font-size="11" fill="#2F5597" font-weight="600" text-anchor="start">u1</text>
<line x1="600" y1="300" x2="640" y2="250" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="585" y="290" font-size="11" fill="#2F5597" font-weight="600" text-anchor="start">u2</text>
<line x1="640" y1="250" x2="670" y2="210" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="625" y="240" font-size="11" fill="#2F5597" font-weight="600" text-anchor="start">u3</text>
<line x1="670" y1="210" x2="690" y2="175" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="655" y="200" font-size="11" fill="#2F5597" font-weight="600" text-anchor="start">u4</text>
<text x="695" y="165" font-size="13" fill="#2F5597" font-weight="700" text-anchor="start">u_k→x1</text>
<rect x="60" y="440" width="840" height="70" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="465" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">幂法：y_k = A u_{k-1}, μ_k = max|y_k|, u_k = y_k/μ_k</text>
<text x="480" y="492" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">μ_k→λ1（模最大特征值），u_k→x1（对应特征向量）；收敛速度~|λ2/λ1|</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">归一化避免溢出；收敛速度取决于|λ2/λ1|</text>
</svg>