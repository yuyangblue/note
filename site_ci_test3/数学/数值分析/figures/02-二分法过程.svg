<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="600" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">二分法：区间逐步分半</text>
<text x="48" y="72" font-size="15" fill="#6B7280">判断中点函数值符号，保留异号的一半，直到满足精度</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="300" x2="880" y2="300" stroke="#6B7280" stroke-width="2"/>
<polygon points="880,295 890,300 880,305" fill="#6B7280"/>
<text x="895" y="305" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">x</text>
<rect x="120" y="280" width="720" height="40" rx="4" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="120" y="270" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">a</text>
<text x="840" y="270" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">b</text>
<text x="480" y="305" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">[a, b] 初始区间，f(a)&lt;0, f(b)&gt;0</text>
<rect x="120" y="360" width="360" height="36" rx="4" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="300" y="383" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">[a, x1] 保留左半</text>
<text x="480" y="383" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">x1 中点</text>
<line x1="480" y1="350" x2="480" y2="400" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="300" y="430" width="180" height="36" rx="4" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="390" y="453" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">[x2, x1]</text>
<line x1="390" y1="420" x2="390" y2="470" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="390" y="415" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">x2</text>
<rect x="345" y="500" width="90" height="36" rx="4" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<text x="390" y="523" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">[x3,x2]</text>
<line x1="390" y1="320" x2="390" y2="355" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<line x1="390" y1="396" x2="390" y2="425" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<line x1="390" y1="466" x2="390" y2="495" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<text x="480" y="560" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">每次区间长度减半：|b_k-a_k| = (b-a)/2^k</text>
<rect x="36" y="538" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="561" font-size="15" fill="#2F5597" font-weight="600">第k次区间长度=(b-a)/2^k，误差&lt;=(b-a)/2^(k+1)</text>
</svg>