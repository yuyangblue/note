<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">向量范数的几何意义：单位圆</text>
<text x="48" y="72" font-size="15" fill="#6B7280">1范数=菱形，2范数=圆，无穷范数=正方形；所有范数等价</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="150" y1="280" x2="450" y2="280" stroke="#6B7280" stroke-width="1.5"/>
<line x1="300" y1="130" x2="300" y2="430" stroke="#6B7280" stroke-width="1.5"/>
<text x="455" y="285" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">x1</text>
<text x="305" y="125" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">x2</text>
<polygon points="300,180 400,280 300,380 200,280" fill="none" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="370" y="210" font-size="13" fill="#2F5597" font-weight="700" text-anchor="start">1范数</text>
<circle cx="300" cy="280" r="100" fill="none" stroke="#70AD47" stroke-width="2.5"/>
<text x="370" y="240" font-size="13" fill="#375623" font-weight="700" text-anchor="start">2范数</text>
<rect x="200" y="180" width="200" height="200" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<text x="370" y="360" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">无穷范数</text>
<rect x="520" y="120" width="400" height="320" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="2"/>
<text x="720" y="150" font-size="17" fill="#1A1B1C" font-weight="700" text-anchor="middle">三种常用向量范数</text>
<rect x="540" y="180" width="360" height="70" rx="8" fill="#E7EDFB" stroke="#FFFFFF" stroke-width="1"/>
<text x="560" y="208" font-size="15" fill="#2F5597" font-weight="700" text-anchor="start">1范数</text>
<text x="560" y="232" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start">||x||_1 = sum |x_i|</text>
<text x="800" y="220" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">各分量绝对值之和</text>
<rect x="540" y="265" width="360" height="70" rx="8" fill="#E2EFDA" stroke="#FFFFFF" stroke-width="1"/>
<text x="560" y="293" font-size="15" fill="#375623" font-weight="700" text-anchor="start">2范数</text>
<text x="560" y="317" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start">||x||_2 = sqrt(sum x_i^2)</text>
<text x="800" y="305" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">欧几里得长度</text>
<rect x="540" y="350" width="360" height="70" rx="8" fill="#FBE5E5" stroke="#FFFFFF" stroke-width="1"/>
<text x="560" y="378" font-size="15" fill="#8B2222" font-weight="700" text-anchor="start">无穷范数</text>
<text x="560" y="402" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start">||x||_inf = max |x_i|</text>
<text x="800" y="390" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">最大分量绝对值</text>
<text x="480" y="500" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">所有范数等价：存在c1,c2使 c1||x||_a &lt;= ||x||_b &lt;= c2||x||_a</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">向量序列收敛与范数选择无关：lim ||x_k - x|| = 0</text>
</svg>