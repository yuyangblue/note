<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">迭代法收敛性：谱半径决定</text>
<text x="48" y="72" font-size="15" fill="#6B7280">ρ(M)&lt;1收敛，误差等比缩小；ρ(M)≥1发散，误差等比放大</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="80" width="420" height="380" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="250" y="110" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">收敛：ρ(M) &lt; 1</text>
<line x1="80" y1="280" x2="420" y2="280" stroke="#6B7280" stroke-width="1"/>
<line x1="80" y1="150" x2="80" y2="380" stroke="#6B7280" stroke-width="1"/>
<text x="425" y="285" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">k</text>
<text x="70" y="145" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">误差</text>
<path d="M 90,160 Q 150,180 200,230 Q 260,290 320,330 Q 370,355 410,365" fill="none" stroke="#70AD47" stroke-width="3"/>
<text x="300" y="300" font-size="13" fill="#375623" font-weight="700" text-anchor="start">||e_k|| ~ ρ^k</text>
<text x="250" y="400" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">误差按等比数列缩小</text>
<text x="250" y="422" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">k→∞ 时 e_k → 0</text>
<rect x="500" y="80" width="420" height="380" rx="14" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<text x="710" y="110" font-size="17" fill="#8B2222" font-weight="700" text-anchor="middle">发散：ρ(M) ≥ 1</text>
<line x1="540" y1="280" x2="880" y2="280" stroke="#6B7280" stroke-width="1"/>
<line x1="540" y1="150" x2="540" y2="380" stroke="#6B7280" stroke-width="1"/>
<text x="885" y="285" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">k</text>
<text x="530" y="145" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">误差</text>
<path d="M 550,365 Q 610,355 660,330 Q 720,290 770,230 Q 820,170 870,155" fill="none" stroke="#C0392B" stroke-width="3"/>
<text x="700" y="200" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">||e_k|| ~ ρ^k</text>
<text x="710" y="400" font-size="13" fill="#8B2222" font-weight="600" text-anchor="middle">误差按等比数列放大</text>
<text x="710" y="422" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">k→∞ 时 e_k → ∞</text>
<rect x="40" y="480" width="880" height="60" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="505" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">收敛充要条件：迭代矩阵谱半径 ρ(M) &lt; 1</text>
<text x="480" y="530" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">充分条件：||M|| &lt; 1（用起来方便，但判断力弱）；渐近收敛速度 R = -ln ρ(M)</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">充要条件是谱半径&lt;1；充分条件是某种范数&lt;1</text>
</svg>