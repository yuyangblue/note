<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="530" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">差商表结构与计算规律</text>
<text x="48" y="72" font-size="15" fill="#6B7280">逐列计算差商，对角线元素是牛顿插值公式的系数</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="80" y="100" width="140" height="40" rx="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1"/>
<text x="150" y="125" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">x_i</text>
<rect x="200" y="100" width="140" height="40" rx="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1"/>
<text x="270" y="125" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">f[x_i]</text>
<rect x="360" y="100" width="140" height="40" rx="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1"/>
<text x="430" y="125" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">一阶差商</text>
<rect x="520" y="100" width="140" height="40" rx="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1"/>
<text x="590" y="125" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">二阶差商</text>
<rect x="680" y="100" width="140" height="40" rx="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1"/>
<text x="750" y="125" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">三阶差商</text>
<rect x="80" y="155" width="140" height="42" rx="4" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="1"/>
<text x="150" y="181" font-size="11" fill="#8A6D1A" font-weight="700" text-anchor="middle">x0</text>
<rect x="200" y="155" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="270" y="181" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f(x0)</text>
<rect x="80" y="210" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="150" y="236" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">x1</text>
<rect x="200" y="210" width="140" height="42" rx="4" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="1"/>
<text x="270" y="236" font-size="11" fill="#8A6D1A" font-weight="700" text-anchor="middle">f(x1)</text>
<rect x="360" y="210" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="430" y="236" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f[x0,x1]</text>
<rect x="80" y="265" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="150" y="291" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">x2</text>
<rect x="200" y="265" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="270" y="291" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f(x2)</text>
<rect x="360" y="265" width="140" height="42" rx="4" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="1"/>
<text x="430" y="291" font-size="11" fill="#8A6D1A" font-weight="700" text-anchor="middle">f[x1,x2]</text>
<rect x="520" y="265" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="590" y="291" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f[x0,x1,x2]</text>
<rect x="80" y="320" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="150" y="346" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">x3</text>
<rect x="200" y="320" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="270" y="346" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f(x3)</text>
<rect x="360" y="320" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="430" y="346" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f[x2,x3]</text>
<rect x="520" y="320" width="140" height="42" rx="4" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="1"/>
<text x="590" y="346" font-size="11" fill="#8A6D1A" font-weight="700" text-anchor="middle">f[x1,x2,x3]</text>
<rect x="680" y="320" width="140" height="42" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/>
<text x="750" y="346" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">f[x0,x1,x2,x3]</text>
<line x1="340" y1="200" x2="350" y2="200" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<line x1="500" y1="255" x2="510" y2="255" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<line x1="660" y1="310" x2="670" y2="310" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="80" y="400" width="800" height="100" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="425" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">计算规律：每个差商 = (左侧元素 - 左上方元素) / (对应节点之差)</text>
<text x="480" y="450" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">牛顿插值公式用到的是对角线元素（黄色高亮）</text>
<text x="480" y="475" font-size="12" fill="#2F5597" font-weight="600" text-anchor="middle">差商性质：与节点次序无关；f[x0..xk] = f^(k)(xi)/k!</text>
<rect x="36" y="468" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="491" font-size="15" fill="#2F5597" font-weight="600">每个差商=(左侧-左上方)/(节点差)；与节点次序无关</text>
</svg>