<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="570" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">Jacobi vs Gauss-Seidel 迭代</text>
<text x="48" y="72" font-size="15" fill="#6B7280">Jacobi全部用旧值，Gauss-Seidel已算出的用新值</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="80" width="420" height="400" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="250" y="110" font-size="18" fill="#2F5597" font-weight="700" text-anchor="middle">Jacobi 迭代</text>
<rect x="100" y="150" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1"/>
<text x="150" y="178" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">x1^(k)</text>
<text x="240" y="165" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">← 全部用 x^(k-1)</text>
<line x1="210" y1="172" x2="235" y2="172" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="100" y="215" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1"/>
<text x="150" y="243" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">x2^(k)</text>
<text x="240" y="230" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">← 全部用 x^(k-1)</text>
<line x1="210" y1="237" x2="235" y2="237" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="100" y="280" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1"/>
<text x="150" y="308" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">x3^(k)</text>
<text x="240" y="295" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">← 全部用 x^(k-1)</text>
<line x1="210" y1="302" x2="235" y2="302" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="100" y="345" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1"/>
<text x="150" y="373" font-size="13" fill="#2F5597" font-weight="700" text-anchor="middle">x4^(k)</text>
<text x="240" y="360" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">← 全部用 x^(k-1)</text>
<line x1="210" y1="367" x2="235" y2="367" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<text x="250" y="430" font-size="12" fill="#2F5597" font-weight="600" text-anchor="middle">特点：计算新值时，右端全部用上一步旧值</text>
<text x="250" y="452" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="middle">B_J = D^(-1)(L+U)</text>
<rect x="500" y="80" width="420" height="400" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="710" y="110" font-size="18" fill="#375623" font-weight="700" text-anchor="middle">Gauss-Seidel 迭代</text>
<rect x="560" y="150" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#70AD47" stroke-width="1"/>
<text x="610" y="178" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">x1^(k)</text>
<text x="700" y="165" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">← 全部用旧值</text>
<line x1="670" y1="172" x2="695" y2="172" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="560" y="215" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#70AD47" stroke-width="1"/>
<text x="610" y="243" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">x2^(k)</text>
<text x="700" y="230" font-size="11" fill="#375623" font-weight="400" text-anchor="start">← 前1个用新值，其余旧值</text>
<line x1="670" y1="237" x2="695" y2="237" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="560" y="280" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#70AD47" stroke-width="1"/>
<text x="610" y="308" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">x3^(k)</text>
<text x="700" y="295" font-size="11" fill="#375623" font-weight="400" text-anchor="start">← 前2个用新值，其余旧值</text>
<line x1="670" y1="302" x2="695" y2="302" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<rect x="560" y="345" width="100" height="45" rx="14" fill="#FFFFFF" stroke="#70AD47" stroke-width="1"/>
<text x="610" y="373" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">x4^(k)</text>
<text x="700" y="360" font-size="11" fill="#375623" font-weight="400" text-anchor="start">← 前3个用新值，其余旧值</text>
<line x1="670" y1="367" x2="695" y2="367" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<text x="710" y="430" font-size="12" fill="#375623" font-weight="600" text-anchor="middle">特点：已算出的分量用新值代替旧值</text>
<text x="710" y="452" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="middle">B_GS = (D-L)^(-1)U</text>
<rect x="40" y="500" width="880" height="40" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="525" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">GS不一定比Jacobi收敛快，具体取决于系数矩阵；两者都可能收敛或发散</text>
<rect x="36" y="508" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="531" font-size="15" fill="#2F5597" font-weight="600">迭代矩阵不同，收敛速度因问题而异</text>
</svg>