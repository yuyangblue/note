<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="550" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">SOR松弛因子与收敛速度</text>
<text x="48" y="72" font-size="15" fill="#6B7280">谱半径随ω先降后升，ω_opt处最小，收敛最快</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="100" y1="280" x2="860" y2="280" stroke="#6B7280" stroke-width="1.5"/>
<line x1="100" y1="100" x2="100" y2="400" stroke="#6B7280" stroke-width="1.5"/>
<text x="870" y="295" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">ω</text>
<text x="90" y="95" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">ρ(B_SOR)</text>
<line x1="100" y1="120" x2="100" y2="400" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3"/>
<text x="100" y="415" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">0</text>
<line x1="820" y1="120" x2="820" y2="400" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3"/>
<text x="820" y="415" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">2</text>
<text x="460" y="415" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">1</text>
<path d="M 110,130 Q 200,200 350,310 Q 460,370 520,360 Q 600,340 700,280 Q 780,200 810,140" fill="none" stroke="#4A6FB5" stroke-width="3"/>
<circle cx="490" cy="358" r="9" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="3"/><text x="490" y="363" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="490" y="340" font-size="14" fill="#8A6D1A" font-weight="700" text-anchor="middle">ω_opt</text>
<line x1="490" y1="346" x2="490" y2="355" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<text x="520" y="363" font-size="11" fill="#8A6D1A" font-weight="600" text-anchor="start">谱半径最小</text>
<rect x="200" y="440" width="560" height="80" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="480" y="465" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">收敛区域：0 &lt; ω &lt; 2（必要条件）</text>
<text x="480" y="490" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">最佳松弛因子：ω_opt = 2/(1+√(1-ρ(B_J)²)) &gt; 1</text>
<text x="480" y="510" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">选取ω_opt可大幅加速收敛（可达十几倍）</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">收敛必要条件0&lt;ω&lt;2；ω_opt&gt;1（超松弛）</text>
</svg>