<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="550" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">切比雪夫交错点组</text>
<text x="48" y="72" font-size="15" fill="#6B7280">最佳一致逼近的充要条件：误差f-P有至少n+2个交错点</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="280" x2="880" y2="280" stroke="#6B7280" stroke-width="1.5"/>
<line x1="80" y1="180" x2="880" y2="180" stroke="#C9CDD4" stroke-width="1" stroke-dasharray="4,3"/>
<text x="70" y="185" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">+E</text>
<line x1="80" y1="380" x2="880" y2="380" stroke="#C9CDD4" stroke-width="1" stroke-dasharray="4,3"/>
<text x="70" y="385" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">-E</text>
<path d="M 100,300 Q 200,200 300,250 Q 400,350 500,280 Q 600,200 700,260 Q 800,340 860,290" fill="none" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="830" y="280" font-size="13" fill="#2F5597" font-weight="700" text-anchor="start">f(x)</text>
<line x1="100" y1="260" x2="860" y2="300" stroke="#70AD47" stroke-width="2.5"/>
<text x="830" y="315" font-size="13" fill="#375623" font-weight="700" text-anchor="start">P(x)</text>
<path d="M 100,280 Q 200,180 300,230 Q 400,330 500,260 Q 600,180 700,240 Q 800,320 860,275" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,3"/>
<text x="150" y="165" font-size="12" fill="#8B2222" font-weight="700" text-anchor="start">f-P</text>
<circle cx="150" cy="180" r="8" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="150" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="150" y="165" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">x1</text>
<line x1="150" y1="190" x2="150" y2="210" stroke="#E0BC5E" stroke-width="1" marker-end="url(#arr)"/>
<circle cx="350" cy="380" r="8" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="350" y="385" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="350" y="365" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">x2</text>
<line x1="350" y1="390" x2="350" y2="410" stroke="#E0BC5E" stroke-width="1" marker-end="url(#arr)"/>
<circle cx="550" cy="180" r="8" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="550" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="550" y="165" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">x3</text>
<line x1="550" y1="190" x2="550" y2="210" stroke="#E0BC5E" stroke-width="1" marker-end="url(#arr)"/>
<circle cx="750" cy="380" r="8" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="750" y="385" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="750" y="365" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">x4</text>
<line x1="750" y1="390" x2="750" y2="410" stroke="#E0BC5E" stroke-width="1" marker-end="url(#arr)"/>
<rect x="60" y="420" width="840" height="100" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="448" font-size="15" fill="#8A6D1A" font-weight="700" text-anchor="middle">切比雪夫定理：P是f的n次最佳一致逼近</text>
<text x="480" y="472" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">充要条件：f-P在[a,b]上存在至少 n+2 个交错点</text>
<text x="480" y="496" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">交错点：|f-P|达到最大值E，且正负交替出现</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">交错点处|f-P|=最大偏差E，且正负交替</text>
</svg>