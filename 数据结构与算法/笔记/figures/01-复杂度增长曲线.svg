<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">常见时间复杂度增长趋势（n = 1..10，y 轴截断）</text>
<text x="48" y="72" font-size="15" fill="#6B7280">大 O 只关心最高阶项——低阶项和常数在 n 足够大时无足轻重</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="880" height="360" rx="14" fill="#FAFBFD" stroke="#D6E0F0" stroke-width="1"/>
<line x1="90" y1="420" x2="910" y2="420" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="90" y1="420" x2="90" y2="100" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<text x="918" y="425" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">n</text>
<text x="76" y="96" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">T(n)</text>
<line x1="90" y1="420" x2="90" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<text x="90" y="442" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">0</text>
<line x1="172" y1="420" x2="172" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<line x1="254" y1="420" x2="254" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<text x="254" y="442" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">2</text>
<line x1="336" y1="420" x2="336" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<line x1="418" y1="420" x2="418" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<text x="418" y="442" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">4</text>
<line x1="500" y1="420" x2="500" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<line x1="582" y1="420" x2="582" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<text x="582" y="442" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">6</text>
<line x1="664" y1="420" x2="664" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<line x1="746" y1="420" x2="746" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<text x="746" y="442" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">8</text>
<line x1="828" y1="420" x2="828" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<line x1="910" y1="420" x2="910" y2="120" stroke="#EEF0F4" stroke-width="1"/>
<text x="910" y="442" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">10</text>
<path d="M 90 417 L 172 417 L 254 417 L 336 417 L 418 417 L 500 417 L 582 417 L 664 417 L 746 417 L 828 417" fill="none" stroke="#70AD47" stroke-width="3"/>
<text x="834" y="411" font-size="14" fill="#70AD47" font-weight="700" text-anchor="start">O(1)</text>
<path d="M 90 420 L 172 417 L 254 416 L 336 415 L 418 414 L 500 413 L 582 412 L 664 412 L 746 412 L 828 411" fill="none" stroke="#8E7CC3" stroke-width="3"/>
<text x="834" y="405" font-size="14" fill="#8E7CC3" font-weight="700" text-anchor="start">O(log n)</text>
<path d="M 90 417 L 172 415 L 254 412 L 336 410 L 418 407 L 500 405 L 582 402 L 664 400 L 746 397 L 828 395" fill="none" stroke="#4A6FB5" stroke-width="3"/>
<text x="834" y="389" font-size="14" fill="#4A6FB5" font-weight="700" text-anchor="start">O(n)</text>
<path d="M 90 420 L 172 415 L 254 408 L 336 400 L 418 390 L 500 381 L 582 370 L 664 360 L 746 348 L 828 336" fill="none" stroke="#E8A33D" stroke-width="3"/>
<text x="834" y="330" font-size="14" fill="#E8A33D" font-weight="700" text-anchor="start">O(n log n)</text>
<path d="M 90 417 L 172 410 L 254 397 L 336 380 L 418 357 L 500 330 L 582 297 L 664 260 L 746 217 L 828 170" fill="none" stroke="#C0392B" stroke-width="3"/>
<text x="834" y="164" font-size="14" fill="#C0392B" font-weight="700" text-anchor="start">O(n²)</text>
<path d="M 90 415 L 172 410 L 254 400 L 336 380 L 418 340 L 500 260 L 582 120 L 664 120 L 746 120 L 828 120" fill="none" stroke="#7030A0" stroke-width="3"/>
<text x="834" y="114" font-size="14" fill="#7030A0" font-weight="700" text-anchor="start">O(2ⁿ)</text>
<text x="650" y="132" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">y 轴截断：2ⁿ 到 n=10 已超 1000</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">排序：O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ)，汉诺塔就是 O(2ⁿ)</text>
</svg>