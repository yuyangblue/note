<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">单链表在第 i 个结点前插入 s：两条改链</text>
<text x="48" y="72" font-size="15" fill="#6B7280">先找到前驱 pre（第 i-1 个结点），再做两次指针修改</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="90" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/>
<text x="123" y="190" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">H</text>
<rect x="210" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2"/>
<text x="243" y="190" font-size="15" fill="#1A1B1C" font-weight="700" text-anchor="middle">a1</text>
<rect x="318" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2"/>
<text x="351" y="190" font-size="15" fill="#6B7280" font-weight="700" text-anchor="middle">…</text>
<rect x="420" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/>
<text x="453" y="190" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">pre</text>
<rect x="540" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2"/>
<text x="573" y="190" font-size="15" fill="#1A1B1C" font-weight="700" text-anchor="middle">ai</text>
<rect x="656" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2"/>
<text x="689" y="190" font-size="15" fill="#6B7280" font-weight="700" text-anchor="middle">…</text>
<rect x="760" y="160" width="66" height="48" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2"/>
<text x="793" y="190" font-size="15" fill="#1A1B1C" font-weight="700" text-anchor="middle">an</text>
<line x1="158" y1="184" x2="208" y2="184" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="278" y1="184" x2="316" y2="184" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="386" y1="184" x2="418" y2="184" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="488" y1="184" x2="538" y2="184" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="608" y1="184" x2="654" y2="184" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="724" y1="184" x2="758" y2="184" stroke="#C9CDD4" stroke-width="2" marker-end="url(#arr)"/>
<rect x="420" y="300" width="66" height="48" rx="10" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2.5"/>
<text x="453" y="330" font-size="15" fill="#8A6D1A" font-weight="700" text-anchor="middle">s(e)</text>
<path d="M 486 300 Q 487 239 540 210" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<text x="546" y="278" font-size="15" fill="#8B2222" font-weight="700" text-anchor="start">① s-&gt;next = pre-&gt;next</text>
<path d="M 420 300 Q 316 176 158 210" fill="none" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<text x="296" y="398" font-size="15" fill="#375623" font-weight="700" text-anchor="start">② pre-&gt;next = s</text>
<text x="480" y="452" font-size="17" fill="#8B2222" font-weight="700" text-anchor="middle">顺序不能颠倒：先连后断</text>
<text x="480" y="486" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">先执行 ② 会断开 pre→ai 的链，后续结点全部丢失</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">口诀：先连后断——① 新结点先连 ai，② pre 再指向 s</text>
</svg>