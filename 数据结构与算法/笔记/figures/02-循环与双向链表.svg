<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">两种链表变体：循环化 + 双向化</text>
<text x="48" y="72" font-size="15" fill="#6B7280">循环解决'找表尾'，双向解决'找前驱'——各补一个短板</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="420" height="340" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="250" y="132" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">循环链表</text>
<text x="250" y="158" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">尾结点 next 指向头结点</text>
<circle cx="250" cy="168" r="26" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="250" y="172" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">H</text>
<circle cx="345" cy="237" r="26" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="345" y="241" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">a1</text>
<circle cx="308" cy="348" r="26" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="308" y="353" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">a2</text>
<circle cx="191" cy="348" r="26" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="191" y="353" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">a3</text>
<circle cx="154" cy="237" r="26" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="154" y="241" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">an</text>
<line x1="250" y1="208" x2="307" y2="249" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="307" y1="249" x2="285" y2="316" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="285" y1="316" x2="214" y2="316" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="214" y1="316" x2="192" y2="249" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="192" y1="249" x2="250" y2="208" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="250" y="415" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">尾指针合并两表 O(1)</text>
<text x="250" y="442" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">约瑟夫环的天然结构</text>
<rect x="500" y="100" width="420" height="340" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="710" y="132" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">双向链表</text>
<text x="710" y="158" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">结点增加 prior 指向前驱</text>
<rect x="560" y="210" width="52" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="586" y="237" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">H</text>
<rect x="632" y="210" width="52" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="658" y="237" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">a1</text>
<rect x="704" y="210" width="52" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="730" y="237" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">a2</text>
<rect x="776" y="210" width="52" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="802" y="237" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">a3</text>
<line x1="614" y1="200" x2="682" y2="200" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<line x1="686" y1="200" x2="754" y2="200" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<line x1="758" y1="200" x2="826" y2="200" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<line x1="682" y1="264" x2="614" y2="264" stroke="#8E7CC3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="754" y1="264" x2="686" y2="264" stroke="#8E7CC3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="826" y1="264" x2="758" y2="264" stroke="#8E7CC3" stroke-width="2" marker-end="url(#arr)"/>
<text x="710" y="300" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">next 链（绿） + prior 链（紫）</text>
<text x="710" y="330" font-size="16" fill="#375623" font-weight="700" text-anchor="middle">找前驱从 O(n) → O(1)</text>
<text x="710" y="370" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">前插 4 条改链 / 删除 2 条</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">循环链表判空：L-&gt;next == L；双向前插 4 条改链同样注意顺序</text>
</svg>