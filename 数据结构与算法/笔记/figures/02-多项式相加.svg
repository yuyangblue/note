<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">一元多项式相加：A(x) + B(x) → C(x)</text>
<text x="48" y="72" font-size="15" fill="#6B7280">结点存 (系数, 指数)，只存非零项，按指数归并</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<text x="120" y="148" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">A</text>
<rect x="220" y="124" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="256" y="138" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">7x</text>
<text x="256" y="158" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(7,0)</text>
<line x1="294" y1="140" x2="306" y2="140" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="320" y="124" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="356" y="138" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">3x^1</text>
<text x="356" y="158" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(3,1)</text>
<line x1="394" y1="140" x2="406" y2="140" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="420" y="124" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="456" y="138" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">9x^8</text>
<text x="456" y="158" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(9,8)</text>
<line x1="494" y1="140" x2="506" y2="140" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="520" y="124" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="556" y="138" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">5x^17</text>
<text x="556" y="158" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(5,17)</text>
<line x1="594" y1="140" x2="606" y2="140" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="120" y="258" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">B</text>
<rect x="220" y="234" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="1.8"/>
<text x="256" y="248" font-size="14" fill="#8A6D1A" font-weight="700" text-anchor="middle">8x^1</text>
<text x="256" y="268" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(8,1)</text>
<line x1="294" y1="250" x2="306" y2="250" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<rect x="320" y="234" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="1.8"/>
<text x="356" y="248" font-size="14" fill="#8A6D1A" font-weight="700" text-anchor="middle">22x^7</text>
<text x="356" y="268" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(22,7)</text>
<line x1="394" y1="250" x2="406" y2="250" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<rect x="420" y="234" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="1.8"/>
<text x="456" y="248" font-size="14" fill="#8A6D1A" font-weight="700" text-anchor="middle">-9x^8</text>
<text x="456" y="268" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(-9,8)</text>
<line x1="494" y1="250" x2="506" y2="250" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<text x="120" y="368" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">C</text>
<rect x="220" y="344" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="256" y="358" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">7x</text>
<text x="256" y="378" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(7,0)</text>
<line x1="294" y1="360" x2="306" y2="360" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<rect x="320" y="344" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="356" y="358" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">11x^1</text>
<text x="356" y="378" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(11,1)</text>
<line x1="394" y1="360" x2="406" y2="360" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<rect x="420" y="344" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="456" y="358" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">22x^7</text>
<text x="456" y="378" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(22,7)</text>
<line x1="494" y1="360" x2="506" y2="360" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<rect x="520" y="344" width="72" height="52" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="556" y="358" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">5x^17</text>
<text x="556" y="378" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">(5,17)</text>
<line x1="594" y1="360" x2="606" y2="360" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="430" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">p.exp &lt; q.exp → 取 p；相等 → 系数相加（和为 0 删两结点）；大于 → 取 q</text>
<text x="480" y="462" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">像归并两个有序序列：谁指数小谁先上</text>
<rect x="480" y="492" width="520" height="36" rx="13" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.6"/><text x="740" y="514" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">稀疏多项式用链式 (coef, exp) 比系数数组省空间</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">结果 C：7 + 11x + 22x⁷ + 5x¹⁷（9x⁸ 与 -9x⁸ 抵消）</text>
</svg>