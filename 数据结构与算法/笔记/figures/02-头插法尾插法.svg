<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">建表两种方法：读入顺序与逻辑顺序</text>
<text x="48" y="72" font-size="15" fill="#6B7280">头插法反转输入（后读入的在前），尾插法保持输入顺序</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="420" height="340" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="250" y="132" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">头插法：读入 a1,a2,a3</text>
<text x="250" y="158" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">链中顺序 → a3,a2,a1（反转）</text>
<rect x="78" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="109" y="217" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">H</text>
<line x1="142" y1="212" x2="168" y2="212" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="170" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="201" y="217" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">a3</text>
<line x1="234" y1="212" x2="260" y2="212" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="262" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="293" y="217" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">a2</text>
<line x1="326" y1="212" x2="352" y2="212" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="354" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.8"/>
<text x="385" y="217" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">a1</text>
<text x="250" y="285" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">s-&gt;next = L-&gt;next;</text>
<text x="250" y="312" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">L-&gt;next = s;</text>
<rect x="250" y="350" width="250" height="36" rx="13" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1.6"/><text x="375" y="372" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">每次插到头结点之后</text>
<rect x="500" y="100" width="420" height="340" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="710" y="132" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">尾插法：读入 a1,a2,a3</text>
<text x="710" y="158" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">链中顺序 → a1,a2,a3（同序）</text>
<rect x="538" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="569" y="217" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">H</text>
<line x1="602" y1="212" x2="628" y2="212" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<rect x="630" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="661" y="217" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">a1</text>
<line x1="694" y1="212" x2="720" y2="212" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<rect x="722" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="753" y="217" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">a2</text>
<line x1="786" y1="212" x2="812" y2="212" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<rect x="814" y="190" width="62" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="845" y="217" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">a3</text>
<text x="710" y="285" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">s-&gt;next = r-&gt;next;</text>
<text x="710" y="312" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">r-&gt;next = s;  r = s;</text>
<rect x="710" y="350" width="250" height="36" rx="13" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.6"/><text x="835" y="372" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">尾指针 r 始终指向表尾</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">应用：头插法天然实现'逆序建表'，栈的场景（见第 3 章）</text>
</svg>