<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">汉诺塔：递归三步 + 栈机制</text>
<text x="48" y="72" font-size="15" fill="#6B7280">关注最大盘：n-1 张整体搬 → 最大盘直接移 → n-1 张再搬</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="440" height="340" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="260" y="132" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">汉诺塔：n 张盘 X → Z（借 Y）</text>
<rect x="142" y="180" width="16" height="180" rx="6" fill="#C9D3E0" stroke="#9AA0A6" stroke-width="1"/>
<text x="150" y="378" font-size="13" fill="#6B7280" font-weight="600" text-anchor="middle">X(源)</text>
<rect x="252" y="180" width="16" height="180" rx="6" fill="#C9D3E0" stroke="#9AA0A6" stroke-width="1"/>
<text x="260" y="378" font-size="13" fill="#6B7280" font-weight="600" text-anchor="middle">Y(借)</text>
<rect x="362" y="180" width="16" height="180" rx="6" fill="#C9D3E0" stroke="#9AA0A6" stroke-width="1"/>
<text x="370" y="378" font-size="13" fill="#6B7280" font-weight="600" text-anchor="middle">Z(目标)</text>
<rect x="128" y="340" width="44" height="18" rx="5" fill="#E7EDFB" stroke="#333" stroke-width="1"/>
<rect x="128" y="340" width="44" height="18" rx="5" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1.4"/>
<rect x="115" y="316" width="70" height="18" rx="5" fill="#FFF6DE" stroke="#333" stroke-width="1"/>
<rect x="115" y="316" width="70" height="18" rx="5" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="1.4"/>
<rect x="102" y="292" width="96" height="18" rx="5" fill="#E2EFDA" stroke="#333" stroke-width="1"/>
<rect x="102" y="292" width="96" height="18" rx="5" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.4"/>
<text x="260" y="420" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="middle">① hanoi(n-1, X, Z, Y)  ② 最大盘 X→Z  ③ hanoi(n-1, Y, X, Z)</text>
<text x="260" y="448" font-size="13" fill="#8B2222" font-weight="600" text-anchor="middle">n=1 时直接移 → 递归终止</text>
<rect x="520" y="100" width="400" height="340" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="720" y="132" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">递归参数用栈保存</text>
<text x="720" y="160" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">每进入一层 → 实参压栈；返回 → 弹栈</text>
<rect x="590" y="300" width="260" height="44" rx="9" fill="#FBE5E5" stroke="#C0392B" stroke-width="1.8"/>
<text x="720" y="328" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">hanoi(1, a, b, c)</text>
<rect x="590" y="242" width="260" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="720" y="270" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">hanoi(2, a, c, b)</text>
<rect x="590" y="184" width="260" height="44" rx="9" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.8"/>
<text x="720" y="212" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">hanoi(3, a, b, c)</text>
<text x="720" y="380" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">栈顶 = 当前层正在用的参数</text>
<text x="720" y="410" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">T(3) = 2³-1 = 7 次移动</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">递归实现 = 参数栈：每层调用压栈，返回时弹栈，栈顶即当前参数</text>
</svg>