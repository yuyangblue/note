<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">四种逻辑结构：按数据元素之间的关系分类</text>
<text x="48" y="72" font-size="15" fill="#6B7280">数据结构的两个层次——先定逻辑结构（面向问题），再选存储结构（面向实现）</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="96" width="210" height="340" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="145" y="128" font-size="19" fill="#2F5597" font-weight="700" text-anchor="middle">集合结构</text>
