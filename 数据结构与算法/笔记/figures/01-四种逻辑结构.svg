<text x="375" y="290" font-size="14" fill="#375623" font-weight="600" text-anchor="middle">前驱 → 后继</text>
<text x="290" y="420" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">一对一</text>
<text x="290" y="440" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">依次相接</text>
