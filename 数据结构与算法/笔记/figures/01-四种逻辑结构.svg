<circle cx="650" cy="235" r="17" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="650" y="238" font-size="11" fill="#8A6D1A" font-weight="600" text-anchor="middle">a3</text>
<line x1="550" y1="250" x2="530" y2="272" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<line x1="570" y1="250" x2="590" y2="272" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
