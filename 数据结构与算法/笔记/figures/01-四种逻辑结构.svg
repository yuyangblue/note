<text x="160" y="260" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start"></text>
<text x="145" y="300" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">a1 a2 a3 a4</text>
<text x="60" y="420" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">元素无关系</text>
<text x="60" y="440" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">只同属一个集合</text>
