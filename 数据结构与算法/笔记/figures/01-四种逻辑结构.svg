<circle cx="590" cy="288" r="15" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="590" y="291" font-size="10" fill="#8A6D1A" font-weight="600" text-anchor="middle">a5</text>
<text x="605" y="330" font-size="14" fill="#8A6D1A" font-weight="600" text-anchor="middle">父 → 子</text>
