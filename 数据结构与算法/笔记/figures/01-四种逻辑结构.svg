<circle cx="900" cy="180" r="16" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="900" y="183" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">a2</text>
<circle cx="770" cy="270" r="16" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="770" y="273" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">a3</text>
<circle cx="900" cy="270" r="16" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="900" y="273" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">a4</text>
<circle cx="835" cy="225" r="16" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="835" y="228" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">a5</text>
<line x1="770" y1="180" x2="835" y2="225" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<line x1="835" y1="225" x2="900" y2="180" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<line x1="770" y1="270" x2="900" y2="270" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<line x1="900" y1="180" x2="900" y2="270" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<line x1="770" y1="180" x2="770" y2="270" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<text x="835" y="320" font-size="14" fill="#8B2222" font-weight="600" text-anchor="middle">多边相连</text>
<text x="750" y="420" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">多对多</text>
<text x="750" y="440" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">任意相连</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">逻辑结构决定'怎么组织'，存储结构决定'怎么存放'；同一逻辑结构可用不同存储结构实现</text>
