<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">栈：操作受限的线性表</text>
<text x="48" y="72" font-size="15" fill="#6B7280">只允许在栈顶插入和删除，栈底固定——后进先出（LIFO）</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="330" y="110" width="300" height="340" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="140" font-size="20" fill="#2F5597" font-weight="700" text-anchor="middle">栈</text>
<rect x="360" y="330" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/>
<text x="480" y="361" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">a1</text>
<rect x="360" y="270" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/>
<text x="480" y="301" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">a2</text>
<rect x="360" y="210" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/>
<text x="480" y="241" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">a3</text>
<rect x="360" y="150" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/>
<text x="480" y="181" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">an</text>
<text x="480" y="402" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">栈底（固定）</text>
<line x1="480" y1="430" x2="480" y2="408" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="648" y="335" font-size="15" fill="#8B2222" font-weight="700" text-anchor="start">top</text>
<line x1="648" y1="343" x2="600" y2="343" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<text x="648" y="300" font-size="13" fill="#8B2222" font-weight="600" text-anchor="start">栈顶</text>
<line x1="250" y1="180" x2="356" y2="330" stroke="#70AD47" stroke-width="3" marker-end="url(#arr)"/>
<text x="196" y="176" font-size="16" fill="#375623" font-weight="700" text-anchor="start">进栈 Push</text>
<line x1="250" y1="368" x2="356" y2="330" stroke="#E0BC5E" stroke-width="3" marker-end="url(#arr)"/>
<text x="190" y="400" font-size="16" fill="#8A6D1A" font-weight="700" text-anchor="start">出栈 Pop</text>
<text x="480" y="486" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">只能在一端（栈顶）插入/删除 → 后进先出 LIFO</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">类比：一摞盘子、浏览器后退、编辑器撤销（Ctrl+Z）</text>
</svg>