<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">表达式求值：操作数栈 + 运算符栈</text>
<text x="48" y="72" font-size="15" fill="#6B7280">当前运算符与栈顶比较优先级——高入栈、低运算、等弹出</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="250" height="300" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="165" y="130" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">操作数栈 OPRD</text>
<rect x="66" y="280" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="165" y="306" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">T4</text>
<rect x="66" y="234" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="165" y="260" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">T3</text>
<rect x="66" y="188" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="165" y="214" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">T2</text>
<rect x="66" y="142" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="165" y="168" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">T1</text>
<rect x="66" y="96" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="165" y="122" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">A</text>
<rect x="320" y="100" width="250" height="300" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="445" y="130" font-size="15" fill="#8A6D1A" font-weight="700" text-anchor="middle">运算符栈 OPTR</text>
<rect x="346" y="280" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="1.5"/>
<text x="445" y="306" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">#</text>
<rect x="346" y="234" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="1.5"/>
<text x="445" y="260" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">+</text>
<rect x="346" y="188" width="198" height="38" rx="8" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="1.5"/>
<text x="445" y="214" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">#</text>
<rect x="610" y="100" width="310" height="300" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="765" y="130" font-size="15" fill="#375623" font-weight="700" text-anchor="middle">求值规则</text>
<text x="640" y="168" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">① 操作数 → 入操作数栈</text>
<text x="640" y="196" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">② 运算符 &gt; 栈顶 → 入栈</text>
<text x="640" y="224" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">③ 运算符 ≤ 栈顶 → 弹两数+一符</text>
<text x="640" y="252" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">   运算，结果压回操作数栈</text>
<text x="640" y="280" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">④ # 与 # 相遇 → 结束</text>
<text x="480" y="420" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">例：A / B^C + D*E → 最终结果 T4 在操作数栈顶</text>
<text x="480" y="456" font-size="13" fill="#8B2222" font-weight="600" text-anchor="middle">⚠ 弹出顺序：先弹第二操作数（B^C 先弹 C 再弹 B）</text>
<text x="480" y="490" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">中缀表达式求值是编译原理的基础</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">运算符优先级表 + 边界符 # 让算法统一处理括号与结束</text>
</svg>