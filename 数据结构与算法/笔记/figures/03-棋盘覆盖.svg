<text x="164" y="514" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="middle">四等分 → 交汇处放 L 型骨牌 → 四个子棋盘都成特殊棋盘</text>
<text x="660" y="140" font-size="16" fill="#2F5597" font-weight="700" text-anchor="start">L 型骨牌：每块覆盖 3 格</text>
<path d="M 660 170 L 700 170 L 700 210 L 680 210 L 680 190 L 660 190 Z" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="660" y="250" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">特殊棋盘：2^k × 2^k</text>
<text x="660" y="286" font-size="15" fill="#1A1B1C" font-weight="700" text-anchor="start">骨牌总数 = (4^k - 1) / 3</text>
<text x="660" y="322" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">除特殊方格外每 3 格 1 块</text>
<text x="660" y="366" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="start">分治：先分解到 k 最小，</text>
<text x="660" y="396" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="start">再逐层用 L 骨牌补成</text>
<text x="660" y="426" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="start">四个特殊子棋盘</text>
<rect x="660" y="460" width="260" height="40" rx="13" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="1.6"/><text x="790" y="484" font-size="14" fill="#8A6D1A" font-weight="700" text-anchor="middle">与分治法四条件呼应</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">递归直到规模 1：每层 4 个子棋盘各自覆盖，不重叠</text>
