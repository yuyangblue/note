<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">换硬币问题的算法优化过程</text>
<text x="48" y="72" font-size="15" fill="#6B7280">1 元换 1/2/5 分共 50 枚，求换法总数——同一问题四种设计</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="46" y="120" width="202" height="250" rx="14" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<text x="147" y="165" font-size="17" fill="#8B2222" font-weight="700" text-anchor="middle">方法1</text>
<text x="147" y="191" font-size="17" fill="#8B2222" font-weight="700" text-anchor="middle">三重循环</text>
<text x="147" y="260" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="middle">51³ ≈ 13.3万次</text>
<text x="147" y="305" font-size="20" fill="#8B2222" font-weight="700" text-anchor="middle">O(n³)</text>
<line x1="251" y1="245" x2="292" y2="245" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
<rect x="268" y="120" width="202" height="250" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="369" y="165" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">方法2</text>
<text x="369" y="191" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">二重循环</text>
<text x="369" y="260" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="middle">51² ≈ 2601次</text>
<text x="369" y="305" font-size="20" fill="#8A6D1A" font-weight="700" text-anchor="middle">O(n²)</text>
<line x1="473" y1="245" x2="514" y2="245" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
<rect x="490" y="120" width="202" height="250" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="591" y="165" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">方法3</text>
<text x="591" y="191" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">改进二重</text>
<text x="591" y="260" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="middle">21×51 ≈ 1071次</text>
<text x="591" y="305" font-size="20" fill="#8A6D1A" font-weight="700" text-anchor="middle">O(n²)</text>
<line x1="695" y1="245" x2="736" y2="245" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
<rect x="712" y="120" width="202" height="250" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="813" y="165" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">方法4</text>
<text x="813" y="191" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">单重循环</text>
<text x="813" y="260" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="middle">仅 13 次</text>
<text x="813" y="305" font-size="20" fill="#375623" font-weight="700" text-anchor="middle">O(1)</text>
<text x="480" y="105" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">同一问题 → 执行次数从 13 万降到 13</text>
<rect x="480" y="420" width="440" height="40" rx="13" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1.6"/><text x="700" y="445" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">算法设计决定数量级：不是快几倍，而是快几万倍</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">优化思路：用方程关系减少枚举层数，最后直接公式判断</text>
</svg>