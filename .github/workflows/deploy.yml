name: Deploy MkDocs

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs-material
      - run: |
          mkdir -p docs/算法与数据结构 docs/数学 docs/计算机与编程 docs/人工智能 docs/课程合集
          cp -r ICPC docs/算法与数据结构/
          cp -r 数据结构 docs/算法与数据结构/
          cp -r 离散数学 docs/数学/
          cp -r 计算方法与优化 docs/数学/
          cp -r 数值分析 docs/数学/
          cp -r 概率论MIT docs/数学/
          cp -r 统计学完全教程 docs/数学/
          cp -r 计算机系统导论 docs/计算机与编程/
          cp -r C++学习 docs/计算机与编程/
          cp -r 深度学习 docs/人工智能/
          cp -r 一些讲座 docs/人工智能/
          cp -r 大一下 docs/课程合集/
          # 原始材料只保留正文 ![[...]] 引用到的图片，其余（字幕、PDF、jsonl）不发布
          find docs/数学/概率论MIT/原始材料 docs/数学/统计学完全教程/原始材料 -type f \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' ! -name '*.gif' ! -name '*.webp' -delete 2>/dev/null || true
          rm -f docs/数学/统计学完全教程/*.py docs/数学/统计学完全教程/notes_manifest.json
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
