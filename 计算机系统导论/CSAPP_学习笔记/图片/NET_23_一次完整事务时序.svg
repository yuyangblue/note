<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1.5 1.5L9 5L1.5 8.5" fill="none" stroke="#185FA5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#FFFFFF"/>

  <rect x="106" y="18" width="128" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="170" y="43" text-anchor="middle" font-size="15" fill="#0C447C">服务器</text>
  <rect x="446" y="18" width="128" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="510" y="43" text-anchor="middle" font-size="15" fill="#0C447C">客户端</text>

  <line x1="170" y1="58" x2="170" y2="404" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="510" y1="58" x2="510" y2="404" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="5 4"/>

  <g font-size="13.5" fill="#2C2C2A">
    <text x="184" y="88">socket() &#8594; listenfd</text>
    <text x="184" y="120">bind() &#160;绑定 IP:端口</text>
    <text x="184" y="152">listen() &#160;转为监听</text>
    <text x="524" y="184">socket() &#8594; fd</text>
    <text x="184" y="254">accept() 阻塞，返回 connfd</text>
    <text x="184" y="398">accept() 再次阻塞，等下一位</text>
  </g>

  <g fill="#0F6E56">
    <circle cx="176" cy="84" r="2.4"/><circle cx="176" cy="116" r="2.4"/><circle cx="176" cy="148" r="2.4"/>
    <circle cx="504" cy="180" r="2.4"/>
    <circle cx="176" cy="250" r="2.4"/><circle cx="176" cy="394" r="2.4"/>
  </g>

  <g font-size="13" fill="#185FA5">
    <text x="340" y="212" text-anchor="middle">connect()</text>
    <text x="340" y="290" text-anchor="middle">GET / HTTP/1.1</text>
    <text x="340" y="326" text-anchor="middle">HTTP/1.1 200 OK &#8230;</text>
    <text x="340" y="362" text-anchor="middle">close()</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.4" fill="none">
    <line x1="510" y1="220" x2="182" y2="220" marker-end="url(#ar)"/>
    <line x1="510" y1="298" x2="182" y2="298" marker-end="url(#ar)"/>
    <line x1="170" y1="334" x2="498" y2="334" marker-end="url(#ar)"/>
    <line x1="510" y1="370" x2="182" y2="370" marker-end="url(#ar)"/>
  </g>

  <g stroke="#9AA5B1" stroke-width="1.2">
    <line x1="164" y1="404" x2="176" y2="404"/>
    <line x1="504" y1="404" x2="516" y2="404"/>
  </g>
</svg>
