<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">有效数字：pi 的两种近似对比</text>
<text x="48" y="72" font-size="15" fill="#6B7280">误差不超过某一位的半个单位 -&gt; 从该位往前数到第一位非零</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="60" y="110" width="400" height="200" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="260" y="142" font-size="20" fill="#2F5597" font-weight="700" text-anchor="middle">pi* = 3.14</text>
<text x="260" y="180" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">pi = 3.14159265...</text>
<text x="260" y="218" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">|pi* - pi| ~ 0.00159</text>
<text x="260" y="250" font-size="15" fill="#375623" font-weight="700" text-anchor="middle">&lt;= 0.005 = 1/2 x 10^-2</text>
<rect x="260" y="280" width="160" height="36" rx="13" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.6"/><text x="340" y="303" font-size="16" fill="#375623" font-weight="700" text-anchor="middle">3 位有效数字</text>
<rect x="500" y="110" width="400" height="200" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="700" y="142" font-size="20" fill="#375623" font-weight="700" text-anchor="middle">pi* = 3.14159</text>
<text x="700" y="180" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle">pi = 3.14159265...</text>
<text x="700" y="218" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">|pi* - pi| ~ 0.00000265</text>
<text x="700" y="250" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">&lt;= 0.000005 = 1/2 x 10^-5</text>
<rect x="700" y="280" width="160" height="36" rx="13" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1.6"/><text x="780" y="303" font-size="16" fill="#2F5597" font-weight="700" text-anchor="middle">6 位有效数字</text>
<rect x="60" y="350" width="840" height="150" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="382" font-size="18" fill="#8A6D1A" font-weight="700" text-anchor="middle">有效数字判断三步法</text>
<circle cx="140" cy="440" r="28" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="140" y="445" font-size="16" fill="#8A6D1A" font-weight="600" text-anchor="middle">1</text>
<text x="190" y="425" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">找到误差不超过</text>
<text x="190" y="445" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">半个单位的最低位</text>
<line x1="230" y1="440" x2="370" y2="440" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="420" cy="440" r="28" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="420" y="445" font-size="16" fill="#8A6D1A" font-weight="600" text-anchor="middle">2</text>
<text x="470" y="425" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">从这一位开始</text>
<text x="470" y="445" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">往前数</text>
<line x1="510" y1="440" x2="650" y2="440" stroke="#E0BC5E" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="700" cy="440" r="28" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="700" y="445" font-size="16" fill="#8A6D1A" font-weight="600" text-anchor="middle">3</text>
<text x="750" y="425" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">数到第一位非零数字</text>
<text x="750" y="445" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">共几位 = 几位有效数字</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">末尾的零不能随便删——0.2300 可能有 4 位有效数字，0.23 最多 2 位</text>
</svg>