<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">数值稳定性：同一公式，正反方向天壤之别</text>
<text x="48" y="72" font-size="15" fill="#6B7280">积分序列 In = 积分 x^n e^(x-1) dx，递推公式严格成立</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="430" height="380" rx="14" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<text x="255" y="132" font-size="18" fill="#8B2222" font-weight="700" text-anchor="middle">正向递推（不稳定）</text>
<text x="255" y="162" font-size="16" fill="#1A1B1C" font-weight="600" text-anchor="middle">In = 1 - n * I(n-1)</text>
<rect x="100" y="210" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="110" y="232" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">e0</text>
<text x="220" y="232" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">10^-8</text>
<rect x="100" y="258" width="115" height="32" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="110" y="280" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">e1</text>
<text x="275" y="280" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">10^-8</text>
<rect x="100" y="306" width="170" height="32" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="110" y="328" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">e5</text>
<text x="330" y="328" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">10^-6</text>
<rect x="100" y="354" width="225" height="32" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="110" y="376" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">e10</text>
<text x="385" y="376" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">10^-2</text>
<rect x="100" y="402" width="280" height="32" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="110" y="424" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">e15</text>
<text x="440" y="424" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">10^5</text>
<text x="255" y="460" font-size="15" fill="#8B2222" font-weight="700" text-anchor="middle">en = n! * e0 -&gt; 误差爆炸</text>
<rect x="510" y="100" width="430" height="380" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="725" y="132" font-size="18" fill="#375623" font-weight="700" text-anchor="middle">逆向递推（稳定）</text>
<text x="725" y="162" font-size="16" fill="#1A1B1C" font-weight="600" text-anchor="middle">I(n-1) = (1 - In) / n</text>
<rect x="570" y="210" width="300" height="32" rx="6" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.5"/>
<text x="580" y="232" font-size="13" fill="#375623" font-weight="700" text-anchor="start">e30</text>
<text x="700" y="232" font-size="13" fill="#375623" font-weight="700" text-anchor="start">很大(粗略)</text>
<rect x="570" y="258" width="245" height="32" rx="6" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.5"/>
<text x="580" y="280" font-size="13" fill="#375623" font-weight="700" text-anchor="start">e20</text>
<text x="700" y="280" font-size="13" fill="#375623" font-weight="700" text-anchor="start">缩小</text>
<rect x="570" y="306" width="190" height="32" rx="6" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.5"/>
<text x="580" y="328" font-size="13" fill="#375623" font-weight="700" text-anchor="start">e10</text>
<text x="700" y="328" font-size="13" fill="#375623" font-weight="700" text-anchor="start">继续缩小</text>
<rect x="570" y="354" width="135" height="32" rx="6" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.5"/>
<text x="580" y="376" font-size="13" fill="#375623" font-weight="700" text-anchor="start">e5</text>
<text x="700" y="376" font-size="13" fill="#375623" font-weight="700" text-anchor="start">很小</text>
<rect x="570" y="402" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.5"/>
<text x="580" y="424" font-size="13" fill="#375623" font-weight="700" text-anchor="start">e0</text>
<text x="700" y="424" font-size="13" fill="#375623" font-weight="700" text-anchor="start">极小</text>
<text x="725" y="460" font-size="15" fill="#375623" font-weight="700" text-anchor="middle">e(n-1) = en/n -&gt; 误差收敛</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">正向误差放大 n! 倍 -&gt; 面目全非；逆向误差逐步缩小 -&gt; 精确收敛</text>
</svg>