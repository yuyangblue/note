<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">数值微分三点公式</text>
<text x="48" y="72" font-size="15" fill="#6B7280">用二次插值多项式的导数近似f'(x)，中心差精度最高</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="280" x2="680" y2="280" stroke="#6B7280" stroke-width="1.5"/>
<line x1="350" y1="80" x2="350" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<path d="M 120,350 Q 200,200 350,180 Q 500,200 620,300" fill="none" stroke="#4A6FB5" stroke-width="2.5"/>
<circle cx="230" cy="230" r="7" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="230" y="235" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="230" y="215" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">x_{i-1}</text>
<text x="230" y="298" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">x_{i-1}</text>
<circle cx="350" cy="180" r="7" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="350" y="185" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="350" y="165" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">x_i</text>
<text x="350" y="298" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">x_i</text>
<circle cx="470" cy="200" r="7" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="470" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="470" y="185" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">x_{i+1}</text>
<text x="470" y="298" font-size="11" fill="#6B7280" font-weight="400" text-anchor="middle">x_{i+1}</text>
<line x1="230" y1="230" x2="470" y2="200" stroke="#70AD47" stroke-width="2.5"/>
<text x="400" y="160" font-size="12" fill="#375623" font-weight="700" text-anchor="middle">中心差斜率</text>
<line x1="390" y1="170" x2="360" y2="200" stroke="#70AD47" stroke-width="1" marker-end="url(#arr)"/>
<line x1="280" y1="210" x2="420" y2="150" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3"/>
<text x="440" y="155" font-size="11" fill="#8B2222" font-weight="600" text-anchor="start">真实切线</text>
<rect x="710" y="100" width="230" height="380" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="825" y="130" font-size="16" fill="#2F5597" font-weight="700" text-anchor="middle">三点公式</text>
<text x="825" y="160" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">左端点</text>
<text x="825" y="180" font-size="10" fill="#1A1B1C" font-weight="400" text-anchor="middle">[-3f0+4f1-f2]/2h</text>
<text x="825" y="215" font-size="12" fill="#375623" font-weight="700" text-anchor="middle">中间点(中心差)</text>
<text x="825" y="235" font-size="12" fill="#375623" font-weight="700" text-anchor="middle">[f2-f0]/2h</text>
<text x="825" y="255" font-size="10" fill="#6B7280" font-weight="400" text-anchor="middle">精度最高 O(h^2)</text>
<text x="825" y="290" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">右端点</text>
<text x="825" y="310" font-size="10" fill="#1A1B1C" font-weight="400" text-anchor="middle">[f0-4f1+3f2]/2h</text>
<text x="825" y="345" font-size="12" fill="#8A6D1A" font-weight="700" text-anchor="middle">二阶导数</text>
<text x="825" y="365" font-size="11" fill="#8A6D1A" font-weight="600" text-anchor="middle">[f0-2f1+f2]/h^2</text>
<rect x="60" y="440" width="880" height="70" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="500" y="465" font-size="14" fill="#8A6D1A" font-weight="600" text-anchor="middle">步长矛盾：h小-&gt;截断误差小，但舍入误差大(ε/h)；h大-&gt;截断误差大</text>
<text x="500" y="492" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">内部节点优先用中心差公式（就近选节点）；函数接近不代表导数接近！</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">步长需综合选取：太小放大舍入误差，太大截断误差大</text>
</svg>