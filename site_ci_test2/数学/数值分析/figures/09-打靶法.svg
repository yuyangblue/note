<text x="800" y="398" font-size="13" fill="#6B7280" font-weight="600" text-anchor="middle">b</text>
<circle cx="800" cy="230" r="10" fill="#FBE5E5" stroke="#C0392B" stroke-width="3"/><text x="800" y="235" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">β</text>
<text x="815" y="225" font-size="12" fill="#8B2222" font-weight="700" text-anchor="start">靶心 y(b)=β</text>
<circle cx="180" cy="280" r="8" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="180" y="285" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle">α</text>
<text x="150" y="275" font-size="12" fill="#2F5597" font-weight="600" text-anchor="start">y(a)=α</text>
