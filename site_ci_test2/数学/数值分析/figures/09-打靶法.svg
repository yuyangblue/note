<text x="680" y="205" font-size="12" fill="#375623" font-weight="700" text-anchor="start">s合适（命中靶心）</text>
<rect x="60" y="410" width="840" height="70" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="432" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">打靶法：边值问题→初值问题，把y'(a)=s当待定参数，迭代调整s使y(b;s)=β</text>
<text x="480" y="455" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">用牛顿法或割线法求F(s)=y(b;s)-β=0的根；形象=调整子弹射出角度击中靶心</text>
<text x="480" y="473" font-size="11" fill="#375623" font-weight="400" text-anchor="middle">F'(s)可用差商近似（割线法），不需要精确求导</text>
<rect x="36" y="448" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="471" font-size="15" fill="#2F5597" font-weight="600">牛顿法/割线法求s；形象=调整射击角度</text>
</svg>