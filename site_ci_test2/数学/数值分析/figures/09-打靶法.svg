<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="510" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">打靶法（射击法）</text>
<text x="48" y="72" font-size="15" fill="#6B7280">将边值问题转化为初值问题，迭代调整初始导数y'(a)=s击中右端边界y(b)=β</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="100" y1="380" x2="880" y2="380" stroke="#6B7280" stroke-width="1.5"/>
<line x1="100" y1="80" x2="100" y2="380" stroke="#6B7280" stroke-width="1.5"/>
<text x="890" y="398" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">x</text>
<text x="85" y="75" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">y</text>
<line x1="180" y1="380" x2="180" y2="130" stroke="#C9CDD4" stroke-width="1" stroke-dasharray="4,3"/>
