<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="550" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">三次样条 vs 分段线性：光滑性对比</text>
<text x="48" y="72" font-size="15" fill="#6B7280">分段线性在节点处是尖点（不可导），三次样条二阶导数连续（光滑）</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="420" height="340" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="2"/>
<text x="250" y="130" font-size="17" fill="#1A1B1C" font-weight="700" text-anchor="middle">分段线性插值</text>
<line x1="80" y1="280" x2="420" y2="280" stroke="#C9CDD4" stroke-width="1"/>
<circle cx="100" cy="350" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="100" y="355" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="170" cy="280" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="170" y="285" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="250" cy="200" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="250" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="330" cy="250" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="330" y="255" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="400" cy="320" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="400" y="325" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<line x1="100" y1="350" x2="170" y2="280" stroke="#4A6FB5" stroke-width="2.5"/>
<line x1="170" y1="280" x2="250" y2="200" stroke="#4A6FB5" stroke-width="2.5"/>
<line x1="250" y1="200" x2="330" y2="250" stroke="#4A6FB5" stroke-width="2.5"/>
<line x1="330" y1="250" x2="400" y2="320" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="170" y="262" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">尖点</text>
<line x1="170" y1="268" x2="170" y2="276" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<text x="250" y="182" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">尖点</text>
<line x1="250" y1="188" x2="250" y2="196" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<text x="330" y="232" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">尖点</text>
<line x1="330" y1="238" x2="330" y2="246" stroke="#C0392B" stroke-width="1" marker-end="url(#arr)"/>
<text x="250" y="400" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">节点处连续但不可导</text>
<text x="250" y="422" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">光滑性差（C^0连续）</text>
<rect x="500" y="100" width="420" height="340" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="710" y="130" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">三次样条插值</text>
<line x1="540" y1="280" x2="880" y2="280" stroke="#C9CDD4" stroke-width="1"/>
<circle cx="560" cy="350" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="560" y="355" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="630" cy="280" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="630" y="285" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="710" cy="200" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="710" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="790" cy="250" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="790" y="255" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="860" cy="320" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="860" y="325" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<path d="M 560,350 Q 595,300 630,280 Q 670,260 710,200 Q 750,230 790,250 Q 825,285 860,320" fill="none" stroke="#70AD47" stroke-width="3"/>
<text x="630" y="262" font-size="10" fill="#375623" font-weight="600" text-anchor="middle">光滑</text>
<line x1="630" y1="268" x2="630" y2="276" stroke="#70AD47" stroke-width="1" marker-end="url(#arr)"/>
<text x="710" y="182" font-size="10" fill="#375623" font-weight="600" text-anchor="middle">光滑</text>
<line x1="710" y1="188" x2="710" y2="196" stroke="#70AD47" stroke-width="1" marker-end="url(#arr)"/>
<text x="790" y="232" font-size="10" fill="#375623" font-weight="600" text-anchor="middle">光滑</text>
<line x1="790" y1="238" x2="790" y2="246" stroke="#70AD47" stroke-width="1" marker-end="url(#arr)"/>
<text x="710" y="400" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">节点处二阶导数连续</text>
<text x="710" y="422" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">光滑性好（C^2连续）</text>
<rect x="40" y="460" width="880" height="60" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="485" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">三次样条 = 每段三次多项式 + 整体二阶导数连续</text>
<text x="480" y="507" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">两全其美：避免龙格现象 + 光滑性好 + 不需要提供节点导数值</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">三次样条两全其美：避免龙格现象+光滑性好+不需节点导数值</text>
</svg>