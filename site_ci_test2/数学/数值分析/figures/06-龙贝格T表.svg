<text x="480" y="475" font-size="15" fill="#5E4B8B" font-weight="700" text-anchor="middle">龙贝格求积 = 理查森外推，逐列加速，收敛极快</text>
<text x="480" y="500" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">通常计算到R_2（第5行）再做误差估计 |R2-R1|/255 &lt; eps</text>
