<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">五种求根方法收敛速度对比</text>
<text x="48" y="72" font-size="15" fill="#6B7280">收敛阶p越高，误差缩小越快；p&gt;1为超线性收敛</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="200" y="120" width="272" height="36" rx="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="190" y="144" font-size="14" fill="#2F5597" font-weight="700" text-anchor="end">二分法</text>
<text x="482" y="144" font-size="13" fill="#2F5597" font-weight="700" text-anchor="start">p=1.000  线性</text>
<text x="482" y="162" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">每次缩一半</text>
<rect x="200" y="185" width="272" height="36" rx="6" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="2"/>
<text x="190" y="209" font-size="14" fill="#6B7280" font-weight="700" text-anchor="end">不动点迭代</text>
<text x="482" y="209" font-size="13" fill="#6B7280" font-weight="700" text-anchor="start">p=1.000  线性</text>
<text x="482" y="227" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">g'(x*)!=0时</text>
<rect x="200" y="250" width="441" height="36" rx="6" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="190" y="274" font-size="14" fill="#8A6D1A" font-weight="700" text-anchor="end">割线法</text>
<text x="651" y="274" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="start">p=1.618  超线性</text>
<text x="651" y="292" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">黄金分割比</text>
<rect x="200" y="315" width="501" height="36" rx="6" fill="#EDE7F6" stroke="#8E7CC3" stroke-width="2"/>
<text x="190" y="339" font-size="14" fill="#5E4B8B" font-weight="700" text-anchor="end">抛物线法</text>
<text x="711" y="339" font-size="13" fill="#5E4B8B" font-weight="700" text-anchor="start">p=1.839  超线性</text>
<text x="711" y="357" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">可求复根</text>
<rect x="200" y="380" width="545" height="36" rx="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="190" y="404" font-size="14" fill="#375623" font-weight="700" text-anchor="end">牛顿法</text>
<text x="755" y="404" font-size="13" fill="#375623" font-weight="700" text-anchor="start">p=2.000  二阶</text>
<text x="755" y="422" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">切线法</text>
<line x1="472" y1="110" x2="472" y2="455" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="472" y="105" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">p=1 线性</text>
<line x1="745" y1="110" x2="745" y2="455" stroke="#375623" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="745" y="105" font-size="11" fill="#375623" font-weight="600" text-anchor="middle">p=2 二阶</text>
<text x="480" y="500" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">p阶收敛：误差 e_{k+1} ~ C * e_k^p，p越高收敛越快</text>
<text x="480" y="525" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">例：当前误差0.1，p=2时下一步~0.01，p=3时下一步~0.001</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">牛顿法p=2最快，割线法p=1.618免导数，二分法p=1最慢但一定收敛</text>
</svg>