<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">牛顿法：切线法</text>
<text x="48" y="72" font-size="15" fill="#6B7280">过(x_k, f(x_k))做切线，切线与x轴交点为x_{k+1}</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="100" y1="450" x2="860" y2="450" stroke="#6B7280" stroke-width="2"/>
<line x1="100" y1="450" x2="100" y2="100" stroke="#6B7280" stroke-width="2"/>
<text x="870" y="455" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">x</text>
<path d="M 150,400 Q 300,350 450,280 Q 600,210 750,150" fill="none" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="730" y="140" font-size="14" fill="#2F5597" font-weight="700" text-anchor="start">y=f(x)</text>
<circle cx="620" cy="450" r="8" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="620" y="455" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="620" y="470" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">x*</text>
<circle cx="300" cy="350" r="7" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="300" y="355" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="300" y="335" font-size="12" fill="#8B2222" font-weight="600" text-anchor="middle">(x0, f(x0))</text>
<text x="300" y="465" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">x0</text>
<line x1="180" y1="430" x2="520" y2="230" stroke="#C0392B" stroke-width="2.5"/>
<text x="480" y="245" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">切线</text>
<circle cx="430" cy="450" r="7" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="430" y="455" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="430" y="465" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">x1</text>
<line x1="300" y1="350" x2="300" y2="450" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="430" cy="290" r="6" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="430" y="295" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<line x1="350" y1="370" x2="580" y2="260" stroke="#E0BC5E" stroke-width="2"/>
<circle cx="550" cy="450" r="6" fill="#EDE7F6" stroke="#8E7CC3" stroke-width="2"/><text x="550" y="455" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="550" y="465" font-size="12" fill="#5E4B8B" font-weight="700" text-anchor="middle">x2</text>
<text x="480" y="520" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">x_{k+1} = x_k - f(x_k)/f'(x_k)，过(x_k,f(x_k))做切线交x轴</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">二阶收敛，误差位数翻倍；但x0太远可能发散</text>
</svg>