<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="550" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">龙格现象：高次插值端点振荡</text>
<text x="48" y="72" font-size="15" fill="#6B7280">f(x)=1/(1+25x^2) 在[-1,1]均匀节点高次插值，端点附近剧烈振荡</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="280" x2="880" y2="280" stroke="#6B7280" stroke-width="1.5"/>
<line x1="480" y1="80" x2="480" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<text x="465" y="435" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">0</text>
<text x="100" y="295" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">-1</text>
<text x="855" y="295" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">1</text>
<path d="M 100,400 Q 200,395 300,350 Q 380,260 480,120 Q 580,260 660,350 Q 760,395 860,400" fill="none" stroke="#4A6FB5" stroke-width="3"/>
<text x="500" y="105" font-size="14" fill="#2F5597" font-weight="700" text-anchor="start">f(x) = 1/(1+25x^2)</text>
<path d="M 100,380 Q 150,150 200,350 Q 250,450 300,300 Q 380,150 480,120 Q 580,150 660,300 Q 710,450 760,350 Q 810,150 860,380" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="8,4"/>
<text x="180" y="130" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">高次插值 P_n(x)</text>
<line x1="160" y1="160" x2="170" y2="200" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<text x="130" y="145" font-size="12" fill="#8B2222" font-weight="700" text-anchor="start">端点振荡!</text>
<line x1="800" y1="160" x2="790" y2="200" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<text x="770" y="145" font-size="12" fill="#8B2222" font-weight="700" text-anchor="start">端点振荡!</text>
<rect x="80" y="450" width="800" height="70" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="475" font-size="15" fill="#8A6D1A" font-weight="700" text-anchor="middle">龙格现象：节点越多(次数越高)，端点附近误差反而越大</text>
<text x="480" y="500" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">原因：余项中 f^(n+1)(xi) 增长极快，超过 (n+1)! 的缩小作用</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">不能盲目提高插值次数；解决方案是分段低次插值或三次样条</text>
</svg>