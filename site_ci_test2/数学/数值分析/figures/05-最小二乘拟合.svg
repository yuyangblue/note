<text x="480" y="475" font-size="15" fill="#375623" font-weight="700" text-anchor="middle">最小二乘拟合：最小化 sum (y_i - phi(x_i))^2</text>
<text x="480" y="500" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">与插值不同：不要求经过所有点（数据有误差），只要求整体趋势最接近</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">不要求经过所有点，只反映整体趋势；法方程组Gc=d求解系数</text>
