<rect x="60" y="370" width="840" height="120" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="400" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">法方程组：sum_j (phi_k, phi_j) * c_j = (f, phi_k)</text>
<text x="480" y="428" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">G_ij = (phi_i, phi_j) = 积分 rho(x)*phi_i(x)*phi_j(x) dx</text>
<text x="480" y="452" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">函数系线性无关时 G 对称正定 -&gt; 用平方根法求解（第3章）</text>
<text x="480" y="476" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">正交函数系时 G 是对角矩阵 -&gt; 只需做除法 c_k = (f,phi_k)/(phi_k,phi_k)</text>
<rect x="36" y="458" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="481" font-size="15" fill="#2F5597" font-weight="600">正交函数系时G变对角，求解只需除法；一般情况用平方根法</text>
