<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="590" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">割线法 vs 牛顿法</text>
<text x="48" y="72" font-size="15" fill="#6B7280">牛顿法用切线（需要导数），割线法用两点连线（免导数）</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="420" height="380" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="250" y="130" font-size="17" fill="#2F5597" font-weight="700" text-anchor="middle">牛顿法（切线）</text>
<line x1="80" y1="420" x2="420" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<path d="M 100,380 Q 200,340 300,290 Q 360,260 400,240" fill="none" stroke="#4A6FB5" stroke-width="2"/>
<circle cx="180" cy="350" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="180" y="355" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<line x1="120" y1="400" x2="300" y2="280" stroke="#C0392B" stroke-width="2"/>
<circle cx="280" cy="420" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="280" y="425" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="180" y="435" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">x_k</text>
<text x="280" y="435" font-size="11" fill="#375623" font-weight="600" text-anchor="middle">x_{k+1}</text>
<text x="250" y="460" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">需要 f'(x_k)</text>
<rect x="500" y="100" width="420" height="380" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="710" y="130" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">割线法（差商）</text>
<line x1="540" y1="420" x2="880" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<path d="M 560,380 Q 660,340 760,290 Q 820,260 860,240" fill="none" stroke="#70AD47" stroke-width="2"/>
<circle cx="620" cy="360" r="6" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="620" y="365" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<circle cx="700" cy="320" r="6" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="700" y="325" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<line x1="600" y1="375" x2="800" y2="270" stroke="#C0392B" stroke-width="2"/>
<circle cx="770" cy="420" r="6" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/><text x="770" y="425" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="620" y="435" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">x_{k-1}</text>
<text x="700" y="435" font-size="11" fill="#8A6D1A" font-weight="600" text-anchor="middle">x_k</text>
<text x="770" y="435" font-size="11" fill="#2F5597" font-weight="600" text-anchor="middle">x_{k+1}</text>
<text x="710" y="460" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">不需要导数，用两点连线</text>
<rect x="40" y="500" width="880" height="60" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="525" font-size="15" fill="#8A6D1A" font-weight="700" text-anchor="middle">牛顿法 p=2（二阶）  |  割线法 p=(1+sqrt5)/2~1.618（黄金分割比，超线性）</text>
<text x="480" y="548" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">割线法每步只需1次函数求值（复用前一步），实际效率可能更高</text>
<rect x="36" y="528" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="551" font-size="15" fill="#2F5597" font-weight="600">割线法收敛阶1.618是黄金分割比，超线性收敛</text>
</svg>