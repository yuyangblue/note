<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="470" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">阿达姆斯四阶预测-校正公式</text>
<text x="48" y="72" font-size="15" fill="#6B7280">显式Adams-Bashforth预测 + 隐式Adams-Moulton校正一次，四阶精度</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="200" x2="880" y2="200" stroke="#6B7280" stroke-width="2"/>
<circle cx="130" cy="200" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="130" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="130" y="225" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="middle">x_{n-3}</text>
<text x="130" y="175" font-size="12" fill="#6B7280" font-weight="700" text-anchor="middle">f_{n-3}</text>
<circle cx="280" cy="200" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="280" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="280" y="225" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="middle">x_{n-2}</text>
<text x="280" y="175" font-size="12" fill="#6B7280" font-weight="700" text-anchor="middle">f_{n-2}</text>
<circle cx="430" cy="200" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="430" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="430" y="225" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="middle">x_{n-1}</text>
<text x="430" y="175" font-size="12" fill="#6B7280" font-weight="700" text-anchor="middle">f_{n-1}</text>
<circle cx="580" cy="200" r="8" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/><text x="580" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="580" y="225" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="middle">x_n</text>
<text x="580" y="175" font-size="12" fill="#4A6FB5" font-weight="700" text-anchor="middle">f_n</text>
<circle cx="780" cy="200" r="8" fill="#FFFFFF" stroke="#70AD47" stroke-width="2"/><text x="780" y="205" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="780" y="225" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="middle">x_{n+1}</text>
<text x="780" y="175" font-size="12" fill="#70AD47" font-weight="700" text-anchor="middle">f_{n+1}</text>
<line x1="580" y1="160" x2="780" y2="160" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="680" y="148" font-size="11" fill="#2F5597" font-weight="600" text-anchor="middle">预测（显式Adams-Bashforth）</text>
<rect x="80" y="50" width="800" height="70" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="72" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">预测：ȳ_{n+1} = y_n + h/24 (55f_n - 59f_{n-1} + 37f_{n-2} - 9f_{n-3})</text>
<text x="480" y="95" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">用前4步已算出的函数值加权外推，每步只需算1个新f值（节省计算量）</text>
<line x1="780" y1="240" x2="580" y2="240" stroke="#70AD47" stroke-width="2" marker-end="url(#arr)"/>
<text x="680" y="258" font-size="11" fill="#375623" font-weight="600" text-anchor="middle">校正（隐式Adams-Moulton，迭代一次）</text>
<rect x="80" y="290" width="800" height="70" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="480" y="312" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">校正：y_{n+1} = y_n + h/24 (9f̄_{n+1} + 19f_n - 5f_{n-1} + f_{n-2})</text>
<text x="480" y="335" font-size="11" fill="#1A1B1C" font-weight="400" text-anchor="middle">用预测值算f̄_{n+1}，代入隐式公式校正一次，四阶精度</text>
<rect x="80" y="390" width="800" height="50" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="412" font-size="13" fill="#8A6D1A" font-weight="600" text-anchor="middle">注意：多步法不能自动起步！需先用RK4等单步法算出 y_1, y_2, y_3 后才能使用</text>
<rect x="36" y="408" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="431" font-size="15" fill="#2F5597" font-weight="600">利用历史值节省计算量，但不能自动起步</text>
</svg>