<rect x="60" y="330" width="840" height="100" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="355" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">QR迭代：A_k = Q_k R_k (QR分解)，A_{k+1} = R_k Q_k (交换相乘)</text>
<text x="480" y="380" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">A_{k+1} = Q_k^T A_k Q_k，正交相似变换，特征值不变</text>
<text x="480" y="405" font-size="12" fill="#375623" font-weight="600" text-anchor="middle">实对称矩阵→三对角化+威尔金森位移QR，二次/三次收敛，是目前最有效的特征值方法</text>
