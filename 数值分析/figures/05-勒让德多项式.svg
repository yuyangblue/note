<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="550" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">勒让德多项式 P0-P4</text>
<text x="48" y="72" font-size="15" fill="#6B7280">区间[-1,1]权函数=1的正交多项式，递推生成</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="80" y1="280" x2="880" y2="280" stroke="#6B7280" stroke-width="1.5"/>
<line x1="480" y1="80" x2="480" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<text x="465" y="435" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">0</text>
<text x="100" y="295" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">-1</text>
<text x="860" y="295" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">1</text>
<line x1="100" y1="200" x2="860" y2="200" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="820" y="190" font-size="12" fill="#2F5597" font-weight="700" text-anchor="start">P0=1</text>
<line x1="100" y1="360" x2="860" y2="200" stroke="#70AD47" stroke-width="2.5"/>
<text x="820" y="215" font-size="12" fill="#375623" font-weight="700" text-anchor="start">P1=x</text>
<path d="M 100,200 Q 300,340 480,360 Q 660,340 860,200" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<text x="820" y="185" font-size="12" fill="#8B2222" font-weight="700" text-anchor="start">P2</text>
<path d="M 100,360 Q 250,380 350,300 Q 480,200 610,260 Q 710,320 860,200" fill="none" stroke="#8E7CC3" stroke-width="2.5"/>
<text x="820" y="240" font-size="12" fill="#5E4B8B" font-weight="700" text-anchor="start">P3</text>
<path d="M 100,200 Q 200,300 300,340 Q 400,360 480,350 Q 560,360 660,340 Q 760,300 860,200" fill="none" stroke="#E0BC5E" stroke-width="2.5"/>
<text x="820" y="265" font-size="12" fill="#8A6D1A" font-weight="700" text-anchor="start">P4</text>
<rect x="60" y="450" width="840" height="70" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="475" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">勒让德多项式：区间[-1,1]，权函数=1</text>
<text x="480" y="500" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">递推：(n+1)P_{n+1}=(2n+1)xP_n-nP_{n-1}；内积 (P_n,P_n)=2/(2n+1)</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">用勒让德多项式做最佳平方逼近时，系数a_k=(2k+1)/2*(f,P_k)</text>
</svg>