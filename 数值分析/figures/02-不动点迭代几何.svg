<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="580" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">不动点迭代几何意义</text>
<text x="48" y="72" font-size="15" fill="#6B7280">求 y=x 与 y=g(x) 的交点，沿阶梯路径逐步逼近</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="100" y1="480" x2="860" y2="480" stroke="#6B7280" stroke-width="2"/>
<line x1="100" y1="480" x2="100" y2="100" stroke="#6B7280" stroke-width="2"/>
<text x="870" y="485" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">x</text>
<text x="95" y="95" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">y</text>
<line x1="100" y1="480" x2="860" y2="100" stroke="#4A6FB5" stroke-width="2.5"/>
<text x="820" y="130" font-size="14" fill="#2F5597" font-weight="700" text-anchor="start">y=x</text>
<path d="M 150,440 Q 300,380 450,310 T 800,180" fill="none" stroke="#70AD47" stroke-width="2.5"/>
<text x="760" y="165" font-size="14" fill="#375623" font-weight="700" text-anchor="start">y=g(x)</text>
<circle cx="530" cy="260" r="8" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="530" y="265" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="545" y="255" font-size="13" fill="#8B2222" font-weight="700" text-anchor="start">x* (不动点)</text>
<line x1="200" y1="480" x2="200" y2="480" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5,3"/>
<line x1="200" y1="480" x2="200" y2="420" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="200" y="495" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">x0</text>
<line x1="340" y1="480" x2="340" y2="420" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5,3"/>
<line x1="340" y1="420" x2="340" y2="365" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="340" y="495" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">x1</text>
<line x1="440" y1="480" x2="440" y2="365" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5,3"/>
<line x1="440" y1="365" x2="440" y2="320" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="440" y="495" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">x2</text>
<text x="480" y="540" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">迭代：x_{k+1}=g(x_k)，沿 y=x 反射逐步逼近不动点</text>
<rect x="36" y="518" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="541" font-size="15" fill="#2F5597" font-weight="600">压缩性 |g'(x*)|&lt;1 保证收敛，g'(x*)&lt;0 时振荡收敛</text>
</svg>