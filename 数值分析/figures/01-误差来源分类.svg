<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">误差的四种来源</text>
<text x="48" y="72" font-size="15" fill="#6B7280">实际问题 -&gt; 数学模型 -&gt; 数值求解，每一步都可能引入误差</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="80" y="110" width="800" height="72" rx="12" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="2"/>
<text x="130" y="154" font-size="18" fill="#6B7280" font-weight="700" text-anchor="start">模型误差</text>
<text x="340" y="154" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">数学建模时忽略次要因素</text>
<rect x="760" y="146" width="100" height="32" rx="13" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="1.6"/><text x="810" y="166" font-size="12" fill="#6B7280" font-weight="700" text-anchor="middle">建模课</text>
<rect x="80" y="200" width="800" height="72" rx="12" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="2"/>
<text x="130" y="244" font-size="18" fill="#6B7280" font-weight="700" text-anchor="start">观测误差</text>
<text x="340" y="244" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">参量/常数通过测量得到</text>
<rect x="760" y="236" width="100" height="32" rx="13" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="1.6"/><text x="810" y="256" font-size="12" fill="#6B7280" font-weight="700" text-anchor="middle">测量课</text>
<rect x="80" y="290" width="800" height="72" rx="12" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="130" y="334" font-size="18" fill="#2F5597" font-weight="700" text-anchor="start">截断误差</text>
<text x="340" y="334" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">无穷级数取前N项 / 近似方法</text>
<rect x="760" y="326" width="100" height="32" rx="13" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="1.6"/><text x="810" y="346" font-size="12" fill="#2F5597" font-weight="700" text-anchor="middle">本课程核心</text>
<rect x="80" y="380" width="800" height="72" rx="12" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="130" y="424" font-size="18" fill="#375623" font-weight="700" text-anchor="start">舍入误差</text>
<text x="340" y="424" font-size="14" fill="#1A1B1C" font-weight="400" text-anchor="start">计算机字长有限，四舍五入</text>
<rect x="760" y="416" width="100" height="32" rx="13" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.6"/><text x="810" y="436" font-size="12" fill="#375623" font-weight="700" text-anchor="middle">本课程核心</text>
<text x="480" y="500" font-size="16" fill="#2F5597" font-weight="700" text-anchor="middle">数值计算方法主要研究：截断误差（方法）+ 舍入误差（机器）</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">模型和观测不是我们的事，截断和舍入才是</text>
</svg>