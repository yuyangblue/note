<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="540" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">近似计算五大原则</text>
<text x="48" y="72" font-size="15" fill="#6B7280">不需要每次做定量误差分析，记住这五条就能避开大部分坑</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="50" y="110" width="280" height="170" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<circle cx="90" cy="150" r="26" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="2"/><text x="90" y="155" font-size="16" fill="#2F5597" font-weight="600" text-anchor="middle">1</text>
<text x="130" y="158" font-size="16" fill="#2F5597" font-weight="700" text-anchor="start">避免相近数相减</text>
<text x="80" y="195" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">有效数字大量损失</text>
<text x="80" y="217" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">分子有理化/泰勒展开</text>
<rect x="360" y="110" width="280" height="170" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<circle cx="400" cy="150" r="26" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="2"/><text x="400" y="155" font-size="16" fill="#8A6D1A" font-weight="600" text-anchor="middle">2</text>
<text x="440" y="158" font-size="16" fill="#8A6D1A" font-weight="700" text-anchor="start">避免小数做分母</text>
<text x="390" y="195" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">误差被极大放大</text>
<text x="390" y="217" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">可能溢出</text>
<rect x="670" y="110" width="280" height="170" rx="14" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<circle cx="710" cy="150" r="26" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/><text x="710" y="155" font-size="16" fill="#8B2222" font-weight="600" text-anchor="middle">3</text>
<text x="750" y="158" font-size="16" fill="#8B2222" font-weight="700" text-anchor="start">避免大数吃小数</text>
<text x="700" y="195" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">浮点对阶挤掉小数</text>
<text x="700" y="217" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">求和从小到大加</text>
<rect x="200" y="310" width="280" height="170" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<circle cx="240" cy="350" r="26" fill="#FFFFFF" stroke="#70AD47" stroke-width="2"/><text x="240" y="355" font-size="16" fill="#375623" font-weight="600" text-anchor="middle">4</text>
<text x="280" y="358" font-size="16" fill="#375623" font-weight="700" text-anchor="start">先化简再计算</text>
<text x="230" y="395" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">减少运算步骤</text>
<text x="230" y="417" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">避免误差积累</text>
<rect x="510" y="310" width="280" height="170" rx="14" fill="#EDE7F6" stroke="#8E7CC3" stroke-width="2"/>
<circle cx="550" cy="350" r="26" fill="#FFFFFF" stroke="#8E7CC3" stroke-width="2"/><text x="550" y="355" font-size="16" fill="#5E4B8B" font-weight="600" text-anchor="middle">5</text>
<text x="590" y="358" font-size="16" fill="#5E4B8B" font-weight="700" text-anchor="start">选稳定算法</text>
<text x="540" y="395" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">误差不增长</text>
<text x="540" y="417" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="start">结果可靠</text>
<rect x="36" y="478" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="501" font-size="15" fill="#2F5597" font-weight="600">相近数相减、小数做分母、大数吃小数是三大高频陷阱</text>
</svg>