<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" style="max-width:100%;height:auto" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif">
<rect width="680" height="300" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<text x="30" y="30" font-size="15" fill="#1f2933" font-weight="600">GKL：A 与 Aᵀ 交替作用，逐列搭出二对角阵</text>
<text x="30" y="50" font-size="11" fill="#6b7785">vⱼ —A→ pⱼ —归一化→ uⱼ —Aᵀ→ qⱼ —归一化→ vⱼ₊₁，如此交替推进</text>
<rect x="34" y="189" width="52" height="32" rx="6" fill="#dbe4fb" stroke="#94a3b8" stroke-width="1.2"/>
<text x="60" y="210" font-size="13" fill="#1f2933" text-anchor="middle">v₁</text>
<rect x="134" y="89" width="52" height="32" rx="6" fill="#dbe4fb" stroke="#94a3b8" stroke-width="1.2"/>
<text x="160" y="110" font-size="13" fill="#1f2933" text-anchor="middle">u₁</text>
<text x="160" y="81" font-size="10" fill="#6b7785" text-anchor="middle">α₁ = ‖p₁‖</text>
<rect x="234" y="189" width="52" height="32" rx="6" fill="#dbe4fb" stroke="#94a3b8" stroke-width="1.2"/>
<text x="260" y="210" font-size="13" fill="#1f2933" text-anchor="middle">v₂</text>
<text x="260" y="235" font-size="10" fill="#6b7785" text-anchor="middle">β₁ = ‖q₁‖</text>
<rect x="334" y="89" width="52" height="32" rx="6" fill="#dbe4fb" stroke="#94a3b8" stroke-width="1.2"/>
<text x="360" y="110" font-size="13" fill="#1f2933" text-anchor="middle">u₂</text>
<text x="360" y="81" font-size="10" fill="#6b7785" text-anchor="middle">α₂ = ‖p₂‖</text>
<rect x="434" y="189" width="52" height="32" rx="6" fill="#dbe4fb" stroke="#94a3b8" stroke-width="1.2"/>
<text x="460" y="210" font-size="13" fill="#1f2933" text-anchor="middle">v₃</text>
<text x="460" y="235" font-size="10" fill="#6b7785" text-anchor="middle">β₂ = ‖q₂‖</text>
<rect x="534" y="89" width="52" height="32" rx="6" fill="#dbe4fb" stroke="#94a3b8" stroke-width="1.2"/>
<text x="560" y="110" font-size="13" fill="#1f2933" text-anchor="middle">u₃</text>
<text x="560" y="81" font-size="10" fill="#6b7785" text-anchor="middle">α₃ = ‖p₃‖</text>
<line x1="87" y1="205" x2="133" y2="105" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="110" y="149" font-size="11" fill="#c2410c" font-weight="600" text-anchor="middle">A</text>
<line x1="187" y1="105" x2="233" y2="205" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="210" y="149" font-size="11" fill="#c2410c" font-weight="600" text-anchor="middle">Aᵀ</text>
<line x1="287" y1="205" x2="333" y2="105" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="310" y="149" font-size="11" fill="#c2410c" font-weight="600" text-anchor="middle">A</text>
<line x1="387" y1="105" x2="433" y2="205" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="410" y="149" font-size="11" fill="#c2410c" font-weight="600" text-anchor="middle">Aᵀ</text>
<line x1="487" y1="205" x2="533" y2="105" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="510" y="149" font-size="11" fill="#c2410c" font-weight="600" text-anchor="middle">A</text>
<text x="612" y="210" font-size="13" fill="#1f2933">…</text>
<text x="30" y="265" font-size="11" fill="#6b7785">上排是左奇异向量组 Uₖ，下排是右奇异向量组 Vₖ；每一步只做一次矩阵–向量乘和一次归一化。</text>
<text x="30" y="285" font-size="11" fill="#6b7785">两组向量各自正交，A Vₖ = Uₖ Bₖ，Bₖ 的对角元是 αⱼ、超对角元是 βⱼ。</text>
</svg>