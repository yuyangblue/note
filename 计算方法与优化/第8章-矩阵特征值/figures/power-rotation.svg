<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 486" width="780" height="486" style="max-width:100%;height:auto" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="780" height="486" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs>
<line x1="194.0" y1="262.0" x2="345.3" y2="110.7" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="352.4" y="107.6" font-size="13" fill="#6b7785" font-weight="600" text-anchor="start">x₁</text>
<line x1="194.0" y1="262.0" x2="297.2" y2="365.2" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="304.3" y="376.3" font-size="13" fill="#6b7785" font-weight="600" text-anchor="start">x₂</text>
<text x="182.0" y="267.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">O</text>
<text x="180.0" y="306.0" font-size="10.5" fill="#9aa5b1" font-weight="400" text-anchor="end">半径向外 = 步数增加</text>
<polyline points="250.0,262.0 268.1,212.6 283.6,179.2 304.5,153.3 327.1,129.3" fill="none" stroke="#1d4ed8" stroke-width="1.6" opacity="0.42"/>
<circle cx="250.0" cy="262.0" r="7.0" fill="#1d4ed8"/>
<circle cx="268.1" cy="212.6" r="5.0" fill="#1d4ed8"/>
<circle cx="283.6" cy="179.2" r="5.0" fill="#1d4ed8"/>
<circle cx="304.5" cy="153.3" r="5.0" fill="#1d4ed8"/>
<circle cx="327.1" cy="129.3" r="5.0" fill="#1d4ed8"/>
<polyline points="250.0,262.0 282.5,252.2 313.2,235.8 341.5,214.4 367.4,189.4" fill="none" stroke="#c2410c" stroke-width="1.6" opacity="0.42"/>
<circle cx="250.0" cy="262.0" r="7.0" fill="#c2410c"/>
<circle cx="282.5" cy="252.2" r="5.0" fill="#c2410c"/>
<circle cx="313.2" cy="235.8" r="5.0" fill="#c2410c"/>
<circle cx="341.5" cy="214.4" r="5.0" fill="#c2410c"/>
<circle cx="367.4" cy="189.4" r="5.0" fill="#c2410c"/>
<text x="238.0" y="246.0" font-size="11.5" fill="#1f2933" font-weight="600" text-anchor="middle">v⁽⁰⁾</text>
<text x="337.1" y="142.3" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">v⁽⁴⁾</text>
<text x="380.4" y="193.4" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">v⁽⁴⁾</text>
<text x="496.0" y="88.0" font-size="14.5" fill="#1f2933" font-weight="600" text-anchor="start">两种比值，同一个初值</text>
<text x="496.0" y="111.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">都从 (1, 0) 出发，λ₁ = 2，各走四步</text>
<rect x="496" y="139" width="3.5" height="50" fill="#1d4ed8"/>
<text x="509.0" y="152.0" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="start">|λ₂/λ₁| = 0.20</text>
<text x="509.0" y="172.0" font-size="10.8" fill="#6b7785" font-weight="400" text-anchor="start">45° → 11.3° → 2.3° → 0.46°</text>
<text x="509.0" y="189.0" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">三步就贴到 x₁</text>
<rect x="496" y="217" width="3.5" height="50" fill="#c2410c"/>
<text x="509.0" y="230.0" font-size="12.5" fill="#c2410c" font-weight="600" text-anchor="start">|λ₂/λ₁| = 0.80</text>
<text x="509.0" y="250.0" font-size="10.8" fill="#6b7785" font-weight="400" text-anchor="start">45° → 38.7° → 32.6° → 27.1°</text>
<text x="509.0" y="267.0" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">二十步才够</text>
<text x="496.0" y="330.0" font-size="12" fill="#1f2933" font-weight="600" text-anchor="start">角度差每步都乘同一个比值</text>
<text x="496.0" y="350.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">这就是「指数收敛」的几何样子：</text>
<text x="496.0" y="368.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">不是匀速转，是越近越慢。</text>
<text x="496.0" y="400.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">转到多近算停，取决于要几位有效数字——</text>
<text x="496.0" y="418.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">0.8²⁰ ≈ 0.012，二十步才把 45° 压到半度。</text>
<text x="40.0" y="440.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">半径只代表步数，不代表向量长度：幂法的长度每步乘 |λ₁|，先归一化，图上才只剩方向。</text>
<text x="40.0" y="462.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">所以「收敛」说的是方向；λ₁ 的模由长度给出，符号由 §3.2 的符号函数给出。</text>
</svg>