<text x="40.0" y="476.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">上排每个 xₖ 都在 x* 两侧来回跳，收敛比例稳定在 0.67 左右；下排的外推值几乎一次就贴到 x*。</text>
<text x="40.0" y="500.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">三个数换十二步：误差从 1.13×10⁻² 直接到 9.3×10⁻⁵。下排点之间没有递推关系，各自独立由上面相邻三个算出。</text>
<text x="40.0" y="524.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">纵轴尺度与上排相同（整体下移），所以下排看起来几乎是一条水平线，这本身就是加速的效果。</text></svg>