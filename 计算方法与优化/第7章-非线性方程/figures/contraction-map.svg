<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="720" height="420" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs><text x="48.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">压缩映射：任意两点的像，距离被同一个 L 倍缩短</text><text x="48.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">L &amp;lt; 1 时反复迭代必然挤到同一点——这就是压缩映射原理</text><circle cx="198" cy="240" r="112" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="548" cy="240" r="67" fill="#fef6f2" stroke="#c2410c" stroke-width="1.8"/><text x="92.0" y="118.0" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="start">D₀</text><text x="601.0" y="163.0" font-size="13" fill="#c2410c" font-weight="600" text-anchor="start">Φ(D₀)</text><line x1="132" y1="196" x2="508.5" y2="213.7" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar-d)"/><circle cx="132" cy="196" r="4.5" fill="#1f2933"/><circle cx="508.5" cy="213.7" r="4.2" fill="#c2410c"/><text x="120.0" y="190.0" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="end">x</text><text x="518.5" y="207.7" font-size="12" fill="#c2410c" font-weight="400" text-anchor="start">Φ(x)</text><line x1="262" y1="306" x2="586.3" y2="279.5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar-d)"/><circle cx="262" cy="306" r="4.5" fill="#1f2933"/><circle cx="586.3" cy="279.5" r="4.2" fill="#c2410c"/><text x="250.0" y="300.0" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="end">y</text><text x="596.3" y="273.5" font-size="12" fill="#c2410c" font-weight="400" text-anchor="start">Φ(y)</text><line x1="132" y1="196" x2="262" y2="306" stroke="#1f2933" stroke-width="1.6"/><line x1="508.5" y1="213.7" x2="586.3" y2="279.5" stroke="#c2410c" stroke-width="1.6"/><text x="196.0" y="234.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="end">‖x − y‖</text><text x="552.0" y="300.0" font-size="11.5" fill="#c2410c" font-weight="400" text-anchor="start">‖Φ(x) − Φ(y)‖</text><circle cx="228" cy="224" r="4.5" fill="#047857"/><text x="238.0" y="220.0" font-size="12.5" fill="#047857" font-weight="600" text-anchor="start">x*</text><text x="48.0" y="388.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">L &lt; 1 时两点像的距离缩到 L 倍；反复作用，像会收缩到唯一的不动点 x*</text></svg>