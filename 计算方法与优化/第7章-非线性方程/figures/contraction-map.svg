<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="720" height="430" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs><text x="48.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">压缩映射：任意两点的像，距离被同一个 L 倍缩短</text><text x="48.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">L &lt; 1 时反复迭代必然挤到同一点——这就是压缩映射原理</text><circle cx="296" cy="252" r="132" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7 5"/><circle cx="348" cy="278" r="68" fill="#fdf2ee" stroke="#c2410c" stroke-width="1.8"/><text x="168.0" y="110.0" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="start">D₀</text><text x="424.0" y="300.0" font-size="13.5" fill="#c2410c" font-weight="600" text-anchor="start">Φ(D₀)</text><line x1="200" y1="175" x2="298.5" y2="238.3" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar-d)"/><circle cx="200" cy="175" r="4.5" fill="#1f2933"/><circle cx="298.5" cy="238.3" r="4.2" fill="#c2410c"/><text x="188.0" y="167.0" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="end">x</text><text x="307.5" y="242.3" font-size="11.5" fill="#c2410c" font-weight="400" text-anchor="start">Φ(x)</text><line x1="250" y1="352" x2="324.3" y2="329.5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar-d)"/><circle cx="250" cy="352" r="4.5" fill="#1f2933"/><circle cx="324.3" cy="329.5" r="4.2" fill="#c2410c"/><text x="238.0" y="344.0" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="end">y</text><text x="333.3" y="333.5" font-size="11.5" fill="#c2410c" font-weight="400" text-anchor="start">Φ(y)</text><line x1="200" y1="175" x2="250" y2="352" stroke="#1f2933" stroke-width="1.7"/><line x1="298.5" y1="238.3" x2="324.3" y2="329.5" stroke="#c2410c" stroke-width="1.7"/><text x="212.0" y="272.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="end">‖x − y‖</text><line x1="311.4" y1="283.9" x2="346" y2="374" stroke="#c2410c" stroke-width="0.9" stroke-dasharray="3 3"/><text x="352.0" y="390.0" font-size="11.5" fill="#c2410c" font-weight="400" text-anchor="start">‖Φ(x) − Φ(y)‖</text><circle cx="332" cy="262" r="4.5" fill="#047857"/><text x="342.0" y="256.0" font-size="12.5" fill="#047857" font-weight="600" text-anchor="start">x*</text><text x="48.0" y="406.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">像落在 D₀ 里面（自映射），距离又缩到 L 倍——所以不动点唯一，且任意初值都收敛</text></svg>