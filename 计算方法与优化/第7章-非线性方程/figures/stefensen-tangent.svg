<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" style="max-width:100%;height:auto" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="780" height="470" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<text x="40.0" y="42.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">Steffensen 的加速：换了个迭代函数，让它在不动点处变平</text>
<text x="40.0" y="66.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">同一根对角线 y = x，同样的不动点 x* ≈ 0.7391 —— 差别只在曲线穿过 x* 时的姿态</text>
<line x1="60.0" y1="368.0" x2="300.0" y2="128.0" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="298.0" y="146.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">y = x</text>
<path d="M 60.0 171.8 L 62.0 172.8 L 64.0 173.9 L 66.0 174.9 L 68.0 176.0 L 70.0 177.1 L 72.0 178.1 L 74.0 179.2 L 76.0 180.3 L 78.0 181.4 L 80.0 182.5 L 82.0 183.6 L 84.0 184.7 L 86.0 185.8 L 88.0 186.9 L 90.0 188.0 L 92.0 189.2 L 94.0 190.3 L 96.0 191.4 L 98.0 192.6 L 100.0 193.7 L 102.0 194.9 L 104.0 196.0 L 106.0 197.2 L 108.0 198.3 L 110.0 199.5 L 112.0 200.7 L 114.0 201.9 L 116.0 203.1 L 118.0 204.3 L 120.0 205.4 L 122.0 206.6 L 124.0 207.9 L 126.0 209.1 L 128.0 210.3 L 130.0 211.5 L 132.0 212.7 L 134.0 214.0 L 136.0 215.2 L 138.0 216.4 L 140.0 217.7 L 142.0 218.9 L 144.0 220.2 L 146.0 221.4 L 148.0 222.7 L 150.0 224.0 L 152.0 225.2 L 154.0 226.5 L 156.0 227.8 L 158.0 229.1 L 160.0 230.4 L 162.0 231.7 L 164.0 233.0 L 166.0 234.3 L 168.0 235.6 L 170.0 236.9 L 172.0 238.2 L 174.0 239.6 L 176.0 240.9 L 178.0 242.2 L 180.0 243.6 L 182.0 244.9 L 184.0 246.3 L 186.0 247.6 L 188.0 249.0 L 190.0 250.3 L 192.0 251.7 L 194.0 253.1 L 196.0 254.4 L 198.0 255.8 L 200.0 257.2 L 202.0 258.6 L 204.0 260.0 L 206.0 261.4 L 208.0 262.8 L 210.0 264.2 L 212.0 265.6 L 214.0 267.0 L 216.0 268.4 L 218.0 269.9 L 220.0 271.3 L 222.0 272.7 L 224.0 274.2 L 226.0 275.6 L 228.0 277.0 L 230.0 278.5 L 232.0 279.9 L 234.0 281.4 L 236.0 282.9 L 238.0 284.3 L 240.0 285.8 L 242.0 287.3 L 244.0 288.8 L 246.0 290.2 L 248.0 291.7 L 250.0 293.2 L 252.0 294.7 L 254.0 296.2 L 256.0 297.7 L 258.0 299.2 L 260.0 300.7 L 262.0 302.3 L 264.0 303.8 L 266.0 305.3 L 268.0 306.8 L 270.0 308.4 L 272.0 309.9 L 274.0 311.4 L 276.0 313.0 L 278.0 314.5 L 280.0 316.1 L 282.0 317.6 L 284.0 319.2 L 286.0 320.7 L 288.0 322.3 L 290.0 323.9 L 292.0 325.5 L 294.0 327.0 L 296.0 328.6 L 298.0 330.2 L 300.0 331.8" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="182.6" cy="245.4" r="5" fill="#1f2933" stroke="#ffffff" stroke-width="1.6"/>
<line x1="182.6" y1="245.4" x2="182.6" y2="368.0" stroke="#1f2933" stroke-width="1" stroke-dasharray="3 4"/>
<text x="190.6" y="384.0" font-size="12" fill="#1f2933" font-weight="600" text-anchor="start">x*</text>
<line x1="134.0" y1="278.1" x2="231.3" y2="212.6" stroke="#c2410c" stroke-width="2"/>
<text x="191.0" y="327.8" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">斜率 −0.674</text>
<circle cx="92.4" cy="335.6" r="4.2" fill="#6b7785"/>
<circle cx="92.4" cy="189.4" r="4.2" fill="#1d4ed8"/>
<line x1="92.4" y1="335.6" x2="92.4" y2="189.4" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="84.4" y="339.6" font-size="11" fill="#6b7785" font-weight="400" text-anchor="end">x₀ = 0.60</text>
<text x="103.4" y="288.9" font-size="11" fill="#1f2933" font-weight="600" text-anchor="start">一步到 0.8253，还差 0.086</text>
<text x="60.0" y="114.0" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">一般不动点迭代：y = g(x)</text>
<text x="60.0" y="98.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">交点处斜着穿过，迭代像沿斜坡往根挪</text>
<line x1="420.0" y1="368.0" x2="660.0" y2="128.0" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="658.0" y="146.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">y = x</text>
<path d="M 452.4 247.1 L 458.5 246.9 L 464.5 246.7 L 470.6 246.5 L 476.6 246.3 L 482.7 246.1 L 488.8 246.0 L 494.8 245.9 L 500.9 245.7 L 506.9 245.6 L 513.0 245.5 L 519.0 245.5 L 525.1 245.4 L 531.1 245.4 L 537.2 245.4 L 543.2 245.4 L 549.3 245.4 L 555.4 245.4 L 561.4 245.4 L 567.5 245.5 L 573.5 245.6 L 579.6 245.7 L 585.6 245.8 L 591.7 245.9 L 597.7 246.1 L 603.8 246.2 L 609.8 246.4 L 615.9 246.6 L 621.9 246.9 L 628.0 247.1 L 634.1 247.4" fill="none" stroke="#047857" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="542.6" cy="245.4" r="5" fill="#1f2933" stroke="#ffffff" stroke-width="1.6"/>
<line x1="542.6" y1="245.4" x2="542.6" y2="368.0" stroke="#1f2933" stroke-width="1" stroke-dasharray="3 4"/>
<text x="550.6" y="384.0" font-size="12" fill="#1f2933" font-weight="600" text-anchor="start">x*</text>
<line x1="494.0" y1="245.4" x2="591.3" y2="245.4" stroke="#c2410c" stroke-width="3"/>
<text x="582.2" y="266.8" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">水平：斜率 0</text>
<circle cx="452.4" cy="335.6" r="4.2" fill="#6b7785"/>
<circle cx="452.4" cy="247.1" r="4.2" fill="#047857"/>
<line x1="452.4" y1="335.6" x2="452.4" y2="247.1" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="444.4" y="339.6" font-size="11" fill="#6b7785" font-weight="400" text-anchor="end">x₀ = 0.60</text>
<text x="463.4" y="288.9" font-size="11" fill="#1f2933" font-weight="600" text-anchor="start">一步到 0.7364，只差 0.0027</text>
<text x="420.0" y="114.0" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">Steffensen：y = φ(x)</text>
<text x="420.0" y="98.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="start">整条曲线几乎是平的，穿过 x* 时也是平的</text>
<text x="40.0" y="398.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">φ 是用 g 现算出来的：φ(x) = (x·g(g(x)) − g(x)²) / (x − 2g(x) + g(g(x)))。</text>
<text x="40.0" y="420.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">它在 x* 处满足 φ(x*) = x* 且 φ′(x*) = 0 —— 迭代函数在不动点处变平，于是 xₖ₊₁ = φ(xₖ) 一步就落到根附近，收敛阶升到 2。</text>
<text x="40.0" y="442.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">这与 Aitken 完全不同：Aitken 改造的是「算出来的序列」，Steffensen 改造的是「迭代函数本身」。</text></svg>