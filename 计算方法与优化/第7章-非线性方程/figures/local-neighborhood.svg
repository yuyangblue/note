<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" style="max-width:100%;height:auto" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="780" height="440" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs>
<text x="40.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">局部收敛：把单点上的 |g′(x*)| &lt; 1 换成一个邻域</text>
<text x="40.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">第一步就是给 |g′| 画一条水平线 L，要求整段邻域都被压在下面</text>
<line x1="96.0" y1="322.0" x2="700.0" y2="322.0" stroke="#9aa5b1" stroke-width="1.2"/>
<line x1="96.0" y1="116.0" x2="96.0" y2="322.0" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="700.0" y="344.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">x</text>
<text x="84.0" y="146.9" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="end">1</text>
<text x="82.0" y="108.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="end">|g′(x)|</text>
<line x1="96.0" y1="142.9" x2="700.0" y2="142.9" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 4"/>
<text x="696.0" y="134.9" font-size="11" fill="#6b7785" font-weight="400" text-anchor="end">1（不能碰）</text>
<path d="M 96.0 157.2 Q 144.3 173.3 192.6 189.4 Q 234.9 206.5 277.2 223.5 Q 313.4 233.3 349.7 243.2 Q 373.8 246.8 398.0 250.3 Q 422.2 247.7 446.3 245.0 Q 482.6 236.9 518.8 228.9 Q 561.1 215.4 603.4 202.0 Q 651.7 183.2 700.0 164.4" fill="none" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="277.2" y="214.5" width="241.6" height="107.5" fill="#e6edfb" opacity="0.85"/>
<line x1="96.0" y1="214.5" x2="700.0" y2="214.5" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="698.0" y="232.5" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="end">L = |g′(x*)| + ε = 0.60</text>
<line x1="277.2" y1="214.5" x2="277.2" y2="322.0" stroke="#6b7785" stroke-width="1.3" stroke-dasharray="4 4"/>
<line x1="398.0" y1="214.5" x2="398.0" y2="322.0" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="4 4"/>
<line x1="518.8" y1="214.5" x2="518.8" y2="322.0" stroke="#6b7785" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="277.2" y="342.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="middle">x* − δ</text>
<text x="398.0" y="342.0" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="middle">x*</text>
<text x="518.8" y="342.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="middle">x* + δ</text>
<circle cx="398.0" cy="250.3" r="4.6" fill="#1f2933"/>
<line x1="398.0" y1="250.3" x2="398.0" y2="214.5" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="408.0" y="254.3" font-size="11.5" fill="#1f2933" font-weight="600" text-anchor="start">|g′(x*)| = 0.40</text>
<line x1="277.2" y1="364.0" x2="518.8" y2="364.0" stroke="#1d4ed8" stroke-width="1.4" marker-start="url(#ar-b)" marker-end="url(#ar-b)"/>
<text x="398.0" y="356.0" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">2δ = 1 − |g′(x*)|</text>
<text x="40.0" y="386.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">曲线的具体形状无所谓，只要连续——这就是「由连续性存在 δ」：</text>
<text x="40.0" y="406.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">邻域里整段被水平线 L 压住，而 L &lt; 1，于是全局定理的两个条件在这个小闭区间上都成立。</text>
<text x="40.0" y="426.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">δ 不能随便取：|g′(x*)| 必须离 1 留出距离，δ 才有可能存在。</text></svg>