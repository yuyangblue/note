<text x="710" y="430" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">在整个剩余子矩阵中选绝对值最大</text>
<text x="710" y="455" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">交换行 + 交换列（需还原解的次序）</text>
<rect x="40" y="500" width="880" height="50" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="522" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">列主元：计算量小，最常用  |  全主元：最稳定，但选主元范围大、计算量大</text>
<text x="480" y="542" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">小主元素会导致乘子很大、误差放大 -&gt; 必须选主元！</text>
