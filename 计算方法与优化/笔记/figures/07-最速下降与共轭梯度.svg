<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="570" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">最速下降法 vs 共轭梯度法</text>
<text x="48" y="72" font-size="15" fill="#6B7280">最速下降法锯齿状收敛慢，共轭梯度法共轭方向高效到达</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="80" width="420" height="400" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="2"/>
<text x="250" y="110" font-size="18" fill="#1A1B1C" font-weight="700" text-anchor="middle">最速下降法</text>
<ellipse cx="250" cy="280" rx="140" ry="80" fill="none" stroke="#C9CDD4" stroke-width="1"/>
<ellipse cx="250" cy="280" rx="100" ry="55" fill="none" stroke="#C9CDD4" stroke-width="1"/>
<ellipse cx="250" cy="280" rx="60" ry="35" fill="none" stroke="#C9CDD4" stroke-width="1"/>
<ellipse cx="250" cy="280" rx="30" ry="18" fill="none" stroke="#C9CDD4" stroke-width="1"/>
<circle cx="250" cy="280" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="250" y="285" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="260" y="275" font-size="13" fill="#375623" font-weight="700" text-anchor="start">x*</text>
<line x1="100" y1="350" x2="350" y2="340" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="350" y1="340" x2="130" y2="310" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="130" y1="310" x2="340" y2="300" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="340" y1="300" x2="160" y2="280" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="160" y1="280" x2="320" y2="275" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="320" y1="275" x2="200" y2="265" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="200" y1="265" x2="300" y2="262" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="300" y1="262" x2="230" y2="258" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/>
<text x="250" y="410" font-size="13" fill="#8B2222" font-weight="600" text-anchor="middle">锯齿现象：前后方向垂直</text>
<text x="250" y="432" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">收敛慢，病态时尤甚</text>
<text x="250" y="452" font-size="12" fill="#2F5597" font-weight="600" text-anchor="middle">p_k = r_k（负梯度方向）</text>
<rect x="500" y="80" width="420" height="400" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="710" y="110" font-size="18" fill="#375623" font-weight="700" text-anchor="middle">共轭梯度法</text>
<ellipse cx="710" cy="280" rx="140" ry="80" fill="none" stroke="#A9D18E" stroke-width="1"/>
<ellipse cx="710" cy="280" rx="100" ry="55" fill="none" stroke="#A9D18E" stroke-width="1"/>
<ellipse cx="710" cy="280" rx="60" ry="35" fill="none" stroke="#A9D18E" stroke-width="1"/>
<ellipse cx="710" cy="280" rx="30" ry="18" fill="none" stroke="#A9D18E" stroke-width="1"/>
<circle cx="710" cy="280" r="6" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><text x="710" y="285" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="720" y="275" font-size="13" fill="#375623" font-weight="700" text-anchor="start">x*</text>
<line x1="560" y1="350" x2="780" y2="310" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="780" y1="310" x2="640" y2="270" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="640" y1="270" x2="720" y2="260" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<line x1="720" y1="260" x2="700" y2="255" stroke="#4A6FB5" stroke-width="2" marker-end="url(#arr)"/>
<text x="710" y="410" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">共轭方向：关于A共轭</text>
<text x="710" y="432" font-size="12" fill="#375623" font-weight="600" text-anchor="middle">收敛快，最多n步精确解</text>
<text x="710" y="452" font-size="12" fill="#2F5597" font-weight="600" text-anchor="middle">p_k = r_k + β_k p_{k-1}</text>
<rect x="40" y="500" width="880" height="40" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="525" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">共轭梯度法是最速下降法的改进，是求解大型对称正定方程组的主要方法</text>
<rect x="36" y="508" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="531" font-size="15" fill="#2F5597" font-weight="600">CG本质是直接法（最多n步），病态时明显优于最速下降</text>
</svg>