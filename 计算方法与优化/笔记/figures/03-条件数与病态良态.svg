<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="570" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">条件数：病态 vs 良态</text>
<text x="48" y="72" font-size="15" fill="#6B7280">条件数是误差放大倍数；cond(A)很大=病态，接近1=良态</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="40" y="100" width="420" height="300" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="250" y="135" font-size="18" fill="#375623" font-weight="700" text-anchor="middle">良态方程组</text>
<text x="250" y="165" font-size="14" fill="#375623" font-weight="600" text-anchor="middle">cond(A) 接近 1</text>
<polygon points="150,200 350,200 320,360 180,360" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="250" y="230" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">输入微小扰动</text>
<text x="250" y="340" font-size="13" fill="#375623" font-weight="700" text-anchor="middle">输出变化也小</text>
<text x="250" y="390" font-size="13" fill="#375623" font-weight="600" text-anchor="middle">误差不被放大</text>
<rect x="500" y="100" width="420" height="300" rx="14" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<text x="710" y="135" font-size="18" fill="#8B2222" font-weight="700" text-anchor="middle">病态方程组</text>
<text x="710" y="165" font-size="14" fill="#8B2222" font-weight="600" text-anchor="middle">cond(A) 很大</text>
<polygon points="560,200 860,200 820,360 600,360" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/>
<text x="710" y="230" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">输入微小扰动</text>
<text x="710" y="340" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">输出变化巨大！</text>
<text x="710" y="390" font-size="13" fill="#8B2222" font-weight="600" text-anchor="middle">误差被放大 cond(A) 倍</text>
<rect x="40" y="430" width="880" height="110" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="480" y="460" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">条件数 cond(A) = ||A|| * ||A^{-1}||</text>
<text x="480" y="490" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">1/cond(A) = 矩阵到奇异矩阵集合的相对距离</text>
<text x="480" y="515" font-size="13" fill="#2F5597" font-weight="600" text-anchor="middle">病态处理：高精度运算 / 预处理（平衡方法）/ 特殊方法 / 改变问题提法</text>
<rect x="36" y="508" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="531" font-size="15" fill="#2F5597" font-weight="600">1/cond(A)=到奇异矩阵的相对距离；病态不是算法问题，是方程组本身的性质</text>
</svg>