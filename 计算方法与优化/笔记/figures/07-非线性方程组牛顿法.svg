<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="550" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">非线性方程组牛顿迭代法</text>
<text x="48" y="72" font-size="15" fill="#6B7280">用雅可比矩阵线性化，沿切线找零点，逐步逼近</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<line x1="100" y1="300" x2="860" y2="300" stroke="#6B7280" stroke-width="1.5"/>
<line x1="480" y1="100" x2="480" y2="420" stroke="#6B7280" stroke-width="1.5"/>
<text x="870" y="315" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">x</text>
<text x="485" y="95" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">F(x)</text>
<path d="M 150,380 Q 250,350 350,280 Q 450,200 550,180 Q 650,200 750,280 Q 800,330 830,360" fill="none" stroke="#4A6FB5" stroke-width="3"/>
<text x="780" y="250" font-size="14" fill="#2F5597" font-weight="700" text-anchor="start">F(x)</text>
<circle cx="550" cy="300" r="8" fill="#E2EFDA" stroke="#70AD47" stroke-width="3"/><text x="550" y="305" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="550" y="320" font-size="14" fill="#375623" font-weight="700" text-anchor="middle">x*</text>
<circle cx="250" cy="340" r="7" fill="#FBE5E5" stroke="#C0392B" stroke-width="2"/><text x="250" y="345" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="250" y="325" font-size="13" fill="#8B2222" font-weight="700" text-anchor="middle">x0</text>
<line x1="250" y1="305" x2="250" y2="335" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<line x1="250" y1="340" x2="380" y2="300" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3"/>
<text x="300" y="280" font-size="10" fill="#8B2222" font-weight="600" text-anchor="middle">切线
(雅可比)</text>
<circle cx="380" cy="300" r="7" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/><text x="380" y="305" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="380" y="318" font-size="13" fill="#8A6D1A" font-weight="700" text-anchor="middle">x1</text>
<line x1="380" y1="295" x2="380" y2="255" stroke="#6B7280" stroke-width="1" marker-end="url(#arr)"/>
<circle cx="380" cy="250" r="5" fill="#FFFFFF" stroke="#E0BC5E" stroke-width="2"/><text x="380" y="255" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<line x1="380" y1="250" x2="480" y2="300" stroke="#8E7CC3" stroke-width="2" stroke-dasharray="5,3"/>
<circle cx="480" cy="300" r="7" fill="#8E7CC3" stroke="#5E4B8B" stroke-width="2"/><text x="480" y="305" font-size="14" fill="#2F5597" font-weight="600" text-anchor="middle"></text>
<text x="480" y="318" font-size="13" fill="#5E4B8B" font-weight="700" text-anchor="middle">x2</text>
<rect x="100" y="440" width="760" height="80" rx="14" fill="#F3F4F6" stroke="#C9CDD4" stroke-width="1"/>
<text x="480" y="465" font-size="15" fill="#2F5597" font-weight="700" text-anchor="middle">牛顿迭代：x^(k+1) = x^(k) - J(x^(k))^(-1) F(x^(k))</text>
<text x="480" y="490" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">J是雅可比矩阵 J_ij = ∂F_i/∂x_j；局部二阶收敛，速度快</text>
<text x="480" y="510" font-size="12" fill="#375623" font-weight="600" text-anchor="middle">n=1时退化为一维牛顿法 x^(k+1)=x^(k)-f(x^(k))/f'(x^(k))</text>
<rect x="36" y="488" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="511" font-size="15" fill="#2F5597" font-weight="600">局部二阶收敛；计算量大（每步需雅可比矩阵+解线性方程组）</text>
</svg>