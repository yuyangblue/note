<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, 'Segoe UI', Arial, sans-serif">
<rect width="960" height="560" fill="#FFFFFF"/>
<text x="48" y="44" font-size="26" font-weight="700" fill="#2F5597">浮点数系统：四要素 + 单双精度位分配</text>
<text x="48" y="72" font-size="15" fill="#6B7280">计算机只能表示有限个、离散的数——机器零不一定是真零</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker></defs>
<rect x="60" y="100" width="840" height="140" rx="14" fill="#E7EDFB" stroke="#4A6FB5" stroke-width="2"/>
<text x="480" y="132" font-size="20" fill="#2F5597" font-weight="700" text-anchor="middle">规格化浮点数：x = +/- 0.d1d2...dt x beta^j</text>
<rect x="120" y="180" width="160" height="40" rx="13" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/><text x="200" y="204" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">beta 基底</text>
<text x="200" y="232" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">进制</text>
<text x="200" y="250" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">通常=2</text>
<rect x="320" y="180" width="160" height="40" rx="13" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/><text x="400" y="204" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">t 精度</text>
<text x="400" y="232" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">尾数位数</text>
<text x="400" y="250" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">决定精度</text>
<rect x="520" y="180" width="160" height="40" rx="13" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/><text x="600" y="204" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">L 下界</text>
<text x="600" y="232" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">阶码最小</text>
<text x="600" y="250" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">j &gt;= L</text>
<rect x="720" y="180" width="160" height="40" rx="13" fill="#FFFFFF" stroke="#4A6FB5" stroke-width="1.6"/><text x="800" y="204" font-size="14" fill="#2F5597" font-weight="700" text-anchor="middle">U 上界</text>
<text x="800" y="232" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">阶码最大</text>
<text x="800" y="250" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">j &lt;= U</text>
<rect x="60" y="290" width="410" height="220" rx="14" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/>
<text x="265" y="322" font-size="17" fill="#375623" font-weight="700" text-anchor="middle">单精度 float（32位）</text>
<rect x="90" y="350" width="20" height="36" rx="4" fill="#FFE0E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="100" y="374" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">符</text>
<rect x="112" y="350" width="120" height="36" rx="4" fill="#E0E8FF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="172" y="374" font-size="12" fill="#2F5597" font-weight="600" text-anchor="middle">阶码 7位</text>
<rect x="234" y="350" width="200" height="36" rx="4" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
<text x="334" y="374" font-size="12" fill="#375623" font-weight="600" text-anchor="middle">尾数 23位</text>
<text x="265" y="418" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">~ 7 位十进制有效数字</text>
<text x="265" y="448" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">范围 ~ 10^-38 ~ 10^38</text>
<text x="265" y="478" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">1 + 7 + 23 = 32 位</text>
<rect x="510" y="290" width="410" height="220" rx="14" fill="#FFF6DE" stroke="#E0BC5E" stroke-width="2"/>
<text x="715" y="322" font-size="17" fill="#8A6D1A" font-weight="700" text-anchor="middle">双精度 double（64位）</text>
<rect x="540" y="350" width="20" height="36" rx="4" fill="#FFE0E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="550" y="374" font-size="11" fill="#8B2222" font-weight="600" text-anchor="middle">符</text>
<rect x="562" y="350" width="150" height="36" rx="4" fill="#E0E8FF" stroke="#4A6FB5" stroke-width="1.5"/>
<text x="637" y="374" font-size="12" fill="#2F5597" font-weight="600" text-anchor="middle">阶码 10位</text>
<rect x="714" y="350" width="180" height="36" rx="4" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
<text x="804" y="374" font-size="12" fill="#375623" font-weight="600" text-anchor="middle">尾数 52位</text>
<text x="715" y="418" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">~ 15 位十进制有效数字</text>
<text x="715" y="448" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">范围 ~ 10^-308 ~ 10^308</text>
<text x="715" y="478" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">1 + 10 + 52 = 64 位</text>
<rect x="36" y="498" width="888" height="46" rx="12" fill="#F0F4FA" stroke="#D6E0F0" stroke-width="1"/>
<text x="480" y="521" font-size="15" fill="#2F5597" font-weight="600">单精度不超过 7 位有效数字，双精度不超过 15 位</text>
</svg>