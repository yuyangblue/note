<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" style="max-width:100%;height:auto" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="780" height="440" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs>
<text x="40.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">最小二乘就是把 b 投影到列空间上</text>
<text x="40.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">残差 r 垂直于整个平面——这就是法方程 AᵀAx = Aᵀb 的几何含义</text>
<polygon points="175.0,318.0 413.0,384.0 505.0,298.0 267.0,232.0" fill="#eef3fd" stroke="#9aa5b1" stroke-width="1.4"/>
<line x1="321.3" y1="156.0" x2="321.3" y2="314.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="321.3" cy="156.0" r="4.5" fill="#1f2933"/>
<line x1="175.0" y1="318.0" x2="321.3" y2="156.0" stroke="#1f2933" stroke-width="2" marker-end="url(#ar)"/>
<line x1="175.0" y1="318.0" x2="321.3" y2="314.0" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-b)"/>
<path d="M 337.3 318.4 L 337.3 302.4 L 321.3 298.0" fill="none" stroke="#c2410c" stroke-width="1.4"/>
<circle cx="321.3" cy="314.0" r="4.5" fill="#1d4ed8"/>
<circle cx="175.0" cy="318.0" r="4" fill="#1f2933"/>
<text x="165.0" y="324.0" font-size="13" fill="#1f2933" font-weight="600" text-anchor="end">O</text>
<text x="331.3" y="158.0" font-size="15" fill="#1f2933" font-weight="600" text-anchor="start">b</text>
<text x="331.3" y="336.0" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="start">Ax̂</text>
<text x="335.3" y="235.0" font-size="13" fill="#c2410c" font-weight="600" text-anchor="start">r = b − Ax̂</text>
<text x="432.0" y="300.0" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="start">col(A)</text>
<text x="545.0" y="152.0" font-size="15" fill="#c2410c" font-weight="600" text-anchor="start">r ⊥ col(A)</text>
<text x="545.0" y="184.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">r 与 A 的每一列都正交：</text>
<text x="545.0" y="206.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">aᵢᵀ(b − Ax̂) = 0,  i = 1…n</text>
<text x="545.0" y="244.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">合起来就是法方程：</text>
<text x="545.0" y="270.0" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="start"><tspan>A</tspan><tspan dy="-5.0" font-size="10.1">T</tspan><tspan dy="5.0" font-size="14">​</tspan><tspan>A</tspan><tspan>x</tspan><tspan> = A</tspan><tspan dy="-5.0" font-size="10.1">T</tspan><tspan dy="5.0" font-size="14">​</tspan><tspan>b</tspan></text>
<text x="545.0" y="312.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">Ax̂ 是 b 在列空间上的投影，</text>
<text x="545.0" y="330.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">b − Ax̂ 是垂直的那部分。</text>
<text x="545.0" y="362.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">A 不满秩时投影点仍唯一，</text>
<text x="545.0" y="380.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">但写成列组合的方式不唯一。</text></svg>