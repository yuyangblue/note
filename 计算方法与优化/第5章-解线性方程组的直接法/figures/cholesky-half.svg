<text x="190.0" y="104.0" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">LU：上下三角都要算</text>
<text x="560.0" y="104.0" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Cholesky：只算下三角</text>
<text x="150.0" y="340.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="middle">L 在下三角</text>
<text x="230.0" y="340.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="middle">U 在上三角</text>
<text x="560.0" y="340.0" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="middle">上三角 = 下三角转置，不用算</text>
<line x1="312.0" y1="218.0" x2="427.0" y2="218.0" stroke="#1d4ed8" stroke-width="2"/>
<path d="M 438.0 218.0 L 425.0 211.5 L 425.0 224.5 z" fill="#1d4ed8"/>
<text x="375.0" y="204.0" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">对称</text>
<text x="375.0" y="244.0" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">省一半</text>
<text x="40.0" y="374.0" font-size="12" fill="#6b7785" font-weight="600" text-anchor="start">存储量</text>
<text x="120.0" y="374.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">LU 存 n² 个元素</text>
<text x="300.0" y="374.0" font-size="13" fill="#9aa5b1" font-weight="400" text-anchor="middle">→</text>
<text x="330.0" y="374.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Cholesky 只存 n(n+1)/2 个（L 的下三角含对角）</text>
<text x="40.0" y="398.0" font-size="12" fill="#6b7785" font-weight="600" text-anchor="start">运算量</text>
<text x="120.0" y="398.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">n³/3 次乘除</text>
<text x="300.0" y="398.0" font-size="13" fill="#9aa5b1" font-weight="400" text-anchor="middle">→</text>
<text x="330.0" y="398.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">n³/6 次乘除，正好一半</text>
<text x="40.0" y="422.0" font-size="12" fill="#6b7785" font-weight="600" text-anchor="start">代价</text>
<text x="120.0" y="422.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">每步要开一次方（共 n 次）</text>
<text x="300.0" y="422.0" font-size="13" fill="#9aa5b1" font-weight="400" text-anchor="middle">→</text>
<text x="330.0" y="422.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">改进平方根法 LDLᵀ 把开方消掉，见 §2.4</text>
<text x="40.0" y="454.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">n = 5 时：LU 要处理 25 个位置，Cholesky 只处理 15 个 —— 省掉的正是那 10 个上三角。</text></svg>