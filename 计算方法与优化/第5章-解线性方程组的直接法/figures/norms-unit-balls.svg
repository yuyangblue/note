<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="720" height="430" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs><text x="48.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">三种范数各自的「单位球」</text><text x="48.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">同样要求长度为 1，形状却不同；嵌套的宽窄就是范数等价常数</text><line x1="98" y1="240" x2="408" y2="240" stroke="#9aa5b1" stroke-width="1.2" marker-end="url(#ar)"/><line x1="250" y1="390" x2="250" y2="88" stroke="#9aa5b1" stroke-width="1.2" marker-end="url(#ar)"/><text x="400.0" y="258.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">x₁</text><text x="264.0" y="96.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">x₂</text><rect x="144" y="134" width="212" height="212" fill="none" stroke="#047857" stroke-width="2.2"/><circle cx="250" cy="240" r="106" fill="none" stroke="#1f2933" stroke-width="2.2"/><polygon points="144,240 250,134 356,240 250,346" fill="none" stroke="#1d4ed8" stroke-width="2.2"/><circle cx="356" cy="240" r="3.2" fill="#1f2933"/><circle cx="144" cy="240" r="3.2" fill="#1f2933"/><circle cx="250" cy="346" r="3.2" fill="#1f2933"/><circle cx="250" cy="134" r="3.2" fill="#1f2933"/><rect x="480" y="118" width="24" height="24" fill="none" stroke="#047857" stroke-width="2.2"/><text x="518.0" y="127.0" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">正方形</text><text x="518.0" y="144.0" font-size="11.5" fill="#047857" font-weight="600" text-anchor="start">‖x‖∞ = 1</text><text x="518.0" y="160.0" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">最外层：每边到 ±1</text><circle cx="492" cy="196" r="12" fill="none" stroke="#1f2933" stroke-width="2.2"/><text x="518.0" y="193.0" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">单位圆</text><text x="518.0" y="210.0" font-size="11.5" fill="#1f2933" font-weight="600" text-anchor="start">‖x‖₂ = 1</text><text x="518.0" y="226.0" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">中间：欧氏长度</text><polygon points="480,262 492,250 504,262 492,274" fill="none" stroke="#1d4ed8" stroke-width="2.2"/><text x="518.0" y="259.0" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">菱形</text><text x="518.0" y="276.0" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">‖x‖₁ = 1</text><text x="518.0" y="292.0" font-size="11" fill="#6b7785" font-weight="400" text-anchor="start">最内层：四个顶点在轴上</text><line x1="480" y1="330" x2="688" y2="330" stroke="#e4e7eb" stroke-width="1" stroke-dasharray="3 3"/><text x="480.0" y="356.0" font-size="12" fill="#6b7785" font-weight="600" text-anchor="start">包含关系</text><text x="480" y="382" font-size="14" fill="#1f2933">B<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> ⊂ B</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> ⊂ B</tspan><tspan dy="4" font-size="10">∞</tspan></text><text x="480.0" y="408.0" font-size="13.5" fill="#1f2933" font-weight="400" text-anchor="start">‖x‖∞ ≤ ‖x‖₂ ≤ ‖x‖₁</text></svg>