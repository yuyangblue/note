<line x1="201.0" y1="276.0" x2="201.0" y2="300.0" stroke="#047857" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#ar-g)"/>
<text x="386.0" y="122.0" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="start">第 r 步做两件事</text>
<text x="386.0" y="148.0" font-size="12.5" fill="#1d4ed8" font-weight="400" text-anchor="start">· U 第 r 行：j = r … n</text>
<text x="386.0" y="170.0" font-size="12.5" fill="#c2410c" font-weight="400" text-anchor="start">· L 第 r 列：i = r+1 … n</text>
<text x="386.0" y="202.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">两件事拼成一个 L 形，手算</text>
<text x="386.0" y="220.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">就是斜着一层层往右下推。</text>
<text x="386.0" y="256.0" font-size="13.5" fill="#c2410c" font-weight="600" text-anchor="start">顺序不能颠倒</text>
<text x="386.0" y="280.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">l_ir 要除以 u_rr，所以同一步里</text>
<text x="386.0" y="298.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">对角元 u_rr 必须先算，再往</text>
<text x="386.0" y="316.0" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">下算这一列（绿圈 → 下方）。</text>
<text x="386.0" y="352.0" font-size="12" fill="#1d4ed8" font-weight="400" text-anchor="start">浅蓝格属 U（j ≥ i）</text>
<text x="386.0" y="372.0" font-size="12" fill="#c2410c" font-weight="400" text-anchor="start">浅橙格属 L（i &gt; j）</text>
<text x="386.0" y="404.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">对角线上 l_ii = 1 不存。</text>
<text x="56.0" y="452.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">A = LU 的每个位置只被用到一次，所以 L、U 可以直接覆盖 A 的存储。</text>
<text x="56.0" y="476.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">数字相同的格子共享同一批已算好的数据，这正是它比先做消去再记乘数更省的原因。</text></svg>