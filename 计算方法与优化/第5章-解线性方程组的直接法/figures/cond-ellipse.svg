<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" style="max-width:100%;height:auto" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="760" height="400" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs>
<text x="40.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">条件数就是「单位圆被拉成多扁的椭圆」</text>
<text x="40.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">同一个 A 作用在圆周上：最长方向拉 3 倍，最短方向拉 1 倍</text>
<circle cx="186.0" cy="208.0" r="84.0" fill="#eef3fd" stroke="#6b7785" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="88.0" y1="208.0" x2="284.0" y2="208.0" stroke="#9aa5b1" stroke-width="1"/>
<line x1="186.0" y1="110.0" x2="186.0" y2="306.0" stroke="#9aa5b1" stroke-width="1"/>
<text x="186.0" y="106.0" font-size="12.5" fill="#6b7785" font-weight="600" text-anchor="middle">‖x‖₂ = 1</text>
<line x1="290.0" y1="208.0" x2="370.0" y2="208.0" stroke="#1f2933" stroke-width="2" marker-end="url(#ar)"/>
<text x="330.0" y="196.0" font-size="15" fill="#1f2933" font-weight="600" text-anchor="middle">A</text>
<ellipse cx="512.0" cy="208.0" rx="116.0" ry="38.0" fill="#e6edfb" stroke="#1d4ed8" stroke-width="2"/>
<line x1="396.0" y1="208.0" x2="628.0" y2="208.0" stroke="#c2410c" stroke-width="1.6" marker-start="url(#ar-r)" marker-end="url(#ar-r)"/>
<line x1="512.0" y1="170.0" x2="512.0" y2="246.0" stroke="#047857" stroke-width="1.6" marker-start="url(#ar-g)" marker-end="url(#ar-g)"/>
<text x="512.0" y="278.0" font-size="12" fill="#c2410c" font-weight="600" text-anchor="middle">σmax = 3（长半轴）</text>
<text x="512.0" y="156.0" font-size="12" fill="#047857" font-weight="600" text-anchor="middle">σmin = 1（短半轴）</text>
<text x="40.0" y="320.0" font-size="14" fill="#1f2933" font-weight="600" text-anchor="start">cond₂(A) = σmax / σmin = 长短轴比 = 3</text>
<text x="40.0" y="346.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">椭圆越扁，cond 越大。求逆相当于把椭圆缩回圆，短轴方向被放大 1/σmin 倍——</text>
<text x="40.0" y="368.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">于是 b 上一点小扰动，在短轴方向上就被成倍放大到解里去。</text></svg>