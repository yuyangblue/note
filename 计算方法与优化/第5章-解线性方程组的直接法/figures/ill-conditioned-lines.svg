<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="'-apple-system','Segoe UI','Microsoft YaHei',sans-serif"><rect width="720" height="430" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs><text x="48.0" y="44.0" font-size="16" fill="#1f2933" font-weight="600" text-anchor="start">两条几乎平行的直线：右端动一点，交点跑很远</text><text x="48.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">夹角越小，同样的 δb 引起的 δx 越大——条件数大就是这个意思</text><line x1="82" y1="356" x2="702" y2="356" stroke="#9aa5b1" stroke-width="1.2" marker-end="url(#ar)"/><line x1="82" y1="356" x2="82" y2="58" stroke="#9aa5b1" stroke-width="1.2" marker-end="url(#ar)"/><text x="696.0" y="374.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">x₁</text><text x="70.0" y="68.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="end">x₂</text><line x1="82.0" y1="346.3" x2="636.6" y2="41.9" stroke="#1f2933" stroke-width="2.2"/><line x1="82.0" y1="320.4" x2="589.4" y2="83.7" stroke="#1f2933" stroke-width="2.2"/><line x1="82.0" y1="312.6" x2="571.7" y2="84.3" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><circle cx="396.7" cy="173.6" r="5" fill="#1f2933"/><circle cx="491.1" cy="121.8" r="5" fill="#c2410c"/><text x="384.7" y="193.6" font-size="13.5" fill="#1f2933" font-weight="600" text-anchor="end">x*</text><text x="503.1" y="113.8" font-size="13.5" fill="#c2410c" font-weight="600" text-anchor="start">x* + δx</text><line x1="402.7" y1="167.6" x2="484.1" y2="128.8" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ar-r)"/><line x1="56.0" y1="320.4" x2="56.0" y2="309.6" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ar-r)"/><text x="48.0" y="334.4" font-size="12" fill="#c2410c" font-weight="600" text-anchor="end">δb₂</text><text x="627.2" y="33.1" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="end">F₁ = 0</text><text x="590.3" y="103.0" font-size="12.5" fill="#1f2933" font-weight="600" text-anchor="start">F₂ = 0</text><text x="571.4" y="122.0" font-size="12" fill="#c2410c" font-weight="600" text-anchor="start">F₂ = δb₂</text><text x="48.0" y="404.0" font-size="12" fill="#6b7785" font-weight="400" text-anchor="start">δb₂ 只挪了 0.12，交点从 (2.67, 2.82) 跳到 (3.47, 3.62)</text></svg>