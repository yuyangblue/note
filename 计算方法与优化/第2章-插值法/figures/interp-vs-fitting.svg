<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" style="max-width:100%;height:auto" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
<rect width="680" height="290" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="30" y="28" font-size="15" fill="#1f2933" font-weight="600">插值与拟合：五个带噪声的测点，两种截然不同的处理</text>
<text x="30" y="232" font-size="13" fill="#1d4ed8" font-weight="600">插值：逐点严格吻合</text>
<text x="370" y="232" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">拟合：整体尽量靠近</text>
<text x="30" y="252" font-size="11" fill="#6b7785">数据有噪声也要穿过，曲线随之起伏</text>
<text x="370" y="252" font-size="11" fill="#6b7785" text-anchor="middle">事先给定形式，只求某种范数下误差最小</text>
<text x="30" y="277" font-size="11" fill="#6b7785">红点是已知的函数值 yᵢ。插值用 g=0 逼曲线过每一点；拟合让 g&gt;0，换整体最优。</text>
