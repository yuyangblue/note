<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" style="max-width:100%;height:auto" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
<rect width="680" height="300" fill="#ffffff"/>
<text x="30" y="26" font-size="15" fill="#1f2933" font-weight="600">帽形基函数：每个 φᵢ 只在相邻三个节点上非零</text>
<text x="30" y="45" font-size="11" fill="#6b7785">φᵢ(xⱼ)=δᵢⱼ；在 [xᵢ₋₁,xᵢ] 线性升到 1，在 [xᵢ,xᵢ₊₁] 线性降回 0</text>
<line x1="90" y1="255" x2="570" y2="255" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="90" y1="255" x2="90" y2="60" stroke="#94a3b8" stroke-width="1.2"/>
<circle cx="90" cy="255" r="3.5" fill="#1f2933"/>
<text x="90" y="273" font-size="12" fill="#1f2933" text-anchor="middle">x0</text>
<circle cx="205" cy="255" r="3.5" fill="#1f2933"/>
<text x="205" y="273" font-size="12" fill="#1f2933" text-anchor="middle">x1</text>
<circle cx="320" cy="255" r="3.5" fill="#1f2933"/>
<text x="320" y="273" font-size="12" fill="#1f2933" text-anchor="middle">x2</text>
<circle cx="435" cy="255" r="3.5" fill="#1f2933"/>
<text x="435" y="273" font-size="12" fill="#1f2933" text-anchor="middle">x3</text>
<circle cx="550" cy="255" r="3.5" fill="#1f2933"/>
<text x="550" y="273" font-size="12" fill="#1f2933" text-anchor="middle">x4</text>
<path d="M 90,85 L 205,255" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<text x="90" y="77" font-size="11" fill="#94a3b8" text-anchor="middle">φ0</text>
<path d="M 90,255 L 205,85 L 320,255" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<text x="205" y="77" font-size="11" fill="#94a3b8" text-anchor="middle">φ1</text>
<rect x="205" y="71" width="230" height="184" fill="#fff1e8" stroke="none"/>
<path d="M 205,255 L 320,85 L 435,255" fill="none" stroke="#c2410c" stroke-width="3"/>
<text x="320" y="77" font-size="11" fill="#c2410c" text-anchor="middle">φ2</text>
<path d="M 320,255 L 435,85 L 550,255" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<text x="435" y="77" font-size="11" fill="#94a3b8" text-anchor="middle">φ3</text>
<path d="M 435,255 L 550,85" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<text x="550" y="77" font-size="11" fill="#94a3b8" text-anchor="middle">φ4</text>
<text x="378" y="65" font-size="11" fill="#c2410c" text-anchor="middle">φ₂ 的支撑 = [x₁,x₂,x₃]，其余为 0</text>
<text x="30" y="285" font-size="11" fill="#6b7785">对比 2.1 的拉格朗日基函数：那里每个 lᵢ 在整个区间上一般非零（全局支撑），这里每个 φᵢ 只占两小段（局部支撑）。</text>
</svg>