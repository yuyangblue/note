    function checkIEOldVers() {        
        if (!navigator.cookieEnabled) {

            return;
        }
        
        var normalUserAgent = (navigator.userAgent.indexOf("chrome") > -1 || navigator.userAgent.indexOf("Safari") > -1 || navigator.userAgent.indexOf("Firefox") > -1) && navigator.userAgent.indexOf("MicroMessenger") < 0;
        if (!normalUserAgent) {
            document.getElementById("browerWarnDIV").style.display='inline';
            document.getElementById("browserAlertText").innerHTML='您的浏览器与平台不兼容，会影响正常使用，推荐您更换为目前主流的浏览器： Chrome、Firefox、Edge、360（注意切换到<b>极速模式</b>）、Safari 等。';

    }  
    checkIEOldVers();
</script>

    <script>
        $(window).resize(function (){           
           setTimeout(cgfooterByResize, 500);
        });
        function cgfooterByResize() {
           
            var cgclientNAVHeight = 72;
            var cgclientNAV = document.getElementById('cgclientNAV');
            if (typeof(cgclientNAV) != 'undefined' && cgclientNAV != null) {  
                cgclientNAVHeight = document.getElementById('cgclientNAV').clientHeight;
            }
            
            var cgcontainerID =  document.getElementById('cgcontainerID');
            if (typeof(cgcontainerID) != 'undefined' && cgcontainerID != null) {                
                var cgPageBodyHeight = document.getElementById('cgcontainerID').clientHeight;
                var cgFooterHeight = document.getElementById('footer').clientHeight;   
                
                var winMinHeight =  window.innerHeight - cgFooterHeight - cgclientNAVHeight;               
                
                $("#cgcontainerID").attr('style', "min-height:" + winMinHeight + "px");
                if(cgPageBodyHeight < winMinHeight){ 
                    $("#footer").css("position","fixed");                           
                }else{
                    $("#footer").css("position","relative");          
                }                
            }    
        }  
        
        $(document).ready(function(){            
           cgfooterByResize();
        });     
        
       
        
    </script>
